const tileLayers=TILES.map(o=>L.tileLayer(o.url,{maxZoom:o.max,attribution:o.attr,subdomains:o.sub,keepBuffer:2,updateWhenZooming:false}));
let _tileErr=0,_tileIdx=0;
tileLayers.forEach(Ly=>Ly.on("tileerror",()=>{if(++_tileErr>=8){_tileErr=0;_tileIdx=(_tileIdx+1)%tileLayers.length;
 map.eachLayer(l=>{if(l instanceof L.TileLayer)map.removeLayer(l);});tileLayers[_tileIdx].addTo(map);}}));
map.on("baselayerchange",e=>{_tileErr=0;_tileIdx=Math.max(0,tileLayers.indexOf(e.layer));});
tileLayers[0].addTo(map);
const _baseMaps={};TILES.forEach((o,i)=>{_baseMaps[o.name]=tileLayers[i];});
L.control.layers(_baseMaps,null,{position:"topright"}).addTo(map);
const byN={};spots.forEach(s=>byN[s.n]=s);
const byName={};spots.forEach(s=>{byName[s.name]=s;});
const markers={};
function flyToSpot(name){const s=byName[name];if(!s||!map)return false;
 map.flyTo([s.lat,s.lng],15,{duration:1.2});
 const mk=markers[name];if(mk)setTimeout(()=>{try{mk.openPopup()}catch(e){}},1250);
 return true;}
function numIcon(n){return L.divIcon({className:"",html:"<span class='mknum' style='width:24px;height:24px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)'>"+n+"</span>",iconSize:[24,24],iconAnchor:[12,12]});}
spots.forEach(s=>{
 const pop="<b><span class='mknum'>"+s.n+"</span>"+esc(s.name)+"</b><br>"+esc(s.blurb)+
  "<br><img src='"+API+"/static/images/"+encodeURIComponent(s.img)+".jpg' alt='"+esc(s.name)+"' style='max-width:200px;border-radius:8px;margin-top:6px' onerror='this.remove()'>"+
  "<br><button class='mkbtn' onclick='askSpot("+s.n+")'>💬 问一问"+esc(s.name)+"</button>";
 const _mk=L.marker([s.lat,s.lng],{icon:numIcon(s.n),title:s.n+". "+s.name}).addTo(map).bindPopup(pop);markers[s.name]=_mk;});
function axisLine(ns,color,dash){L.polyline(ns.map(n=>[byN[n].lat,byN[n].lng]),{color:color,weight:3,dashArray:dash}).addTo(map);}
axisLine([1,2,3,4,5,6,7,8,14,15],"#8f2b2f",null);
axisLine([9,10],"#c9a227","6 5");
axisLine([12,13],"#c9a227","6 5");
function askSpot(n){const s=byN[n];if(s)send(s.q);map.closePopup();}
// —— 问答 ——
function fmt2(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}
function showSrc(srcs){if(!srcs||!srcs.length)return "";
 return "<div class='src'>📚 <b>来源</b>："+srcs.slice(0,3).map(s=>esc((s.source||"")+" · "+(s.title||""))).join("；")+"</div>";}
const LENS_LABEL={tour:"🗺 游中轴视角",history:"📜 讲历史视角",arch:"🏯 看建筑视角",textbook:"📖 对课本视角",practical:"🎒 实用派视角"};
// —— 课堂地图（v2.7.7）：22_分册 8 条核验课文总览，每条问法均经引擎检索命中验证 ——
const KBMAP=[
 {t:"音乐一年级上册《我爱北京天安门》",s:"天安门",q:"音乐课上那首《我爱北京天安门》跟天安门有什么关系？"},
 {t:"语文一年级下册第3课《我多想去看看》",s:"天安门（升旗）",q:"语文课本《我多想去看看》跟天安门有什么关系？"},
 {t:"语文六年级上册第6课《开国大典》",s:"天安门广场",q:"开国大典是第几课？"},
 {t:"语文八年级上册第21课《人民英雄永垂不朽》",s:"广场纪念碑",q:"语文课《人民英雄永垂不朽》讲的是哪里的纪念碑？"},
 {t:"历史七年级下册第15课《明朝的统治》",s:"故宫（紫禁城落成）",q:"历史课本里怎么讲紫禁城？"},
 {t:"历史八年级上册第11课《五四运动》",s:"天安门",q:"五四运动是历史第几课？"},
 {t:"美术五年级上册第7课《古朴精美的华表》",s:"故宫/天安门华表",q:"美术课《古朴精美的华表》讲的是哪里的华表？"},
 {t:"美术九年级上册第2课《故宫六百年》",s:"故宫",q:"美术课讲故宫会提到什么？"}];
async function send(q,lensOverride){
 const lens=lensOverride||curLens;
 add(esc(q),"me");
 const t=document.createElement("div");t.className="row bot";t.innerHTML='<div class="av">🏯</div><div class="bub">云端思考中…</div>';chat.appendChild(t);scrollChat(t);
 try{
  const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:q,history:history.slice(-10),session_id:SID,lens:lens})});
  const d=await r.json();t.remove();
  if(d.error){add("❌ "+esc(d.error),"bot");return;}
  let h="";
  const retLens=(d.meta&&d.meta.lens)||lens;
  if(retLens&&LENS_LABEL[retLens])h+="<span class='lensline'>"+LENS_LABEL[retLens]+"作答</span><br>";
  h+=fmt(d.answer||"")+showSrc(d.sources);
  if(d.image){h="<img src='"+API+esc(d.image)+"' style='max-width:100%;border-radius:10px;display:block;margin-bottom:8px'>"+h;}
  const m=d.meta||{};
  const focusName=m.focus;
  if(focusName&&byName[focusName]){h+="<br><button class='mapjump' data-spot='"+esc(focusName)+"'>📍 地图上看看"+esc(focusName)+"</button>";}
  const row=add(h,"bot");
  const jb=row.querySelector(".mapjump");
  if(jb)jb.onclick=()=>{flyToSpot(jb.getAttribute("data-spot"));document.getElementById("mapwrap").scrollIntoView({behavior:"smooth",block:"start"});};
  if(focusName)flyToSpot(focusName);
  if(m.focus&&d.intent!=="story"){const r2=document.createElement("div");r2.className="row bot";
   r2.innerHTML='<div class="av">🏯</div><div class="bub" style="background:transparent;border:none;padding:2px 0"><button class="chip">📖 听《'+esc(m.focus)+"》的故事</button></div>";
   r2.querySelector("button").onclick=()=>send("给我讲讲"+m.focus+"的历史故事");
   chat.appendChild(r2);scrollChat(r2);}
  const fups=d.followups||[];
  if(fups.length){const r3=document.createElement("div");r3.className="row bot";
   r3.innerHTML='<div class="av">🏯</div><div class="bub" style="background:transparent;border:none;padding:2px 0"><div class="fups"></div></div>';
   const box=r3.querySelector(".fups");
   fups.forEach(f=>{const b=document.createElement("button");b.className="fup";b.textContent="💬 "+f.label;b.title=f.q;b.onclick=()=>send(f.q);box.appendChild(b);});
   chat.appendChild(r3);scrollChat(r3);}
  history.push({role:"user",content:q},{role:"assistant",content:d.answer});
 }catch(e){t.remove();noteFail();add("❌ 网络异常或服务未响应（当前服务地址 "+esc(API)+"）。<a href='./offline.html' style='color:#8f2b2f'>点此切换离线知识版</a>，或在网址后加 ?api=新地址 重试。","bot");}
}
// —— 拍照识图 ——
$("cam").onclick=()=>$("imgInput").click();
$("imgInput").onchange=async inp=>{
 const f=inp.target.files[0];inp.value="";if(!f)return;
 add("（上传了一张照片，请帮我识别古建）","me");
 const t=document.createElement("div");t.className="row bot";t.innerHTML='<div class="av">🏯</div><div class="bub">正在识别…</div>';chat.appendChild(t);
 try{
  const fd=new FormData();fd.append("image",f);
  const r=await fetch(API+"/api/identify",{method:"POST",body:fd});
  const d=await r.json();t.remove();
  if(d.error){add("❌ "+esc(d.error),"bot");return;}
  add(fmt(d.answer||"")+showSrc(d.sources),"bot");
 }catch(e){t.remove();noteFail();add("❌ 网络异常，识别未完成，请稍后重试。","bot");}
};
// —— 手机端地图折叠（默认收起省屏，点则展开；桌面端按钮隐藏，此逻辑无影响） ——
(function(){const w=$("mapwrap"),b=$("maptoggle");if(!w||!b)return;
 const isMobile=window.matchMedia("(max-width:640px)").matches;
 if(isMobile)w.classList.add("folded");
 b.querySelector(".tg-state").textContent=isMobile?"（已收起，点我":"（";
 b.onclick=()=>{const f=w.classList.toggle("folded");
  b.querySelector(".tg-state").textContent=f?"（已收起，点我":"（已展开，点我收起";
  if(!f&&window._leaflet_map){try{setTimeout(()=>window._leaflet_map.invalidateSize(),50);}catch(e){}}
  if(!f)setTimeout(()=>w.scrollIntoView({behavior:"smooth",block:"start"}),60);};})();
// —— 五分类导航（与离线版同源模板；点模板透传板块 lens，手动输入沿用当前板块） ——
(function(){
 const bar=$("catbar"),panel=$("catpanel");
 DATA.cats.forEach((c,idx)=>{
  const b=document.createElement("button");b.className="catbtn"+(idx===0?" on":"");
  b.innerHTML=c.icon+"<b>"+esc(c.name)+"</b><span>"+esc(c.desc)+"</span>";
  b.onclick=()=>{curLens=c.id;bar.querySelectorAll(".catbtn").forEach(x=>x.className="catbtn");b.className="catbtn on";showCat(c);};
  bar.appendChild(b);});
 function showCat(c){panel.innerHTML="";
  const d=document.createElement("div");d.className="catdesc";
  d.textContent=c.icon+" "+c.name+" · "+c.desc+"：点下面的模板可直接提问，也可照着改词问。";
  panel.appendChild(d);
  // —— 课本板块课堂地图（v2.7.7）：8 篇目录级核验课文总览，点条目即问（问法均经引擎命中验证） ——
  if(c.id==="textbook"&&typeof KBMAP!=="undefined"){
   const km=document.createElement("details");km.className="kbmap";km.open=true;
   const sm=document.createElement("summary");sm.textContent="📖 课堂地图：8 篇课文 × 中轴线（目录级核验，点条目即问）";
   km.appendChild(sm);
   KBMAP.forEach(k=>{const b=document.createElement("button");b.className="kb";
    b.innerHTML="<b>"+esc(k.t)+"</b> → "+esc(k.s);b.title=k.q;
    b.onclick=()=>send(k.q,c.id);km.appendChild(b);});
   panel.appendChild(km);}
  const w=document.createElement("div");w.className="tmpls";
  c.templates.forEach(t=>{const m=document.createElement("button");m.className="tmpl";m.textContent="💬 "+t.label;
   m.title=t.q;m.onclick=()=>send(t.q,c.id);w.appendChild(m);});
  panel.appendChild(w);}
 curLens=DATA.cats[0].id;
 showCat(DATA.cats[0]);
})();
$("bar").onsubmit=e=>{e.preventDefault();const v=$("inp").value;$("inp").value="";if(v.trim())send(v.trim());};
if(window.visualViewport){visualViewport.addEventListener("resize",()=>{const b=$("bar");if(document.activeElement===$("inp"))setTimeout(()=>{try{$("inp").scrollIntoView({block:"nearest"})}catch(e){}},150);});}

function setOffline(on){$("offbar").className=on?"show":"";}
fetch(API+"/api/config").then(r=>r.json()).then(()=>{setOffline(false);}).catch(()=>{setOffline(true);});
// 问答/识图失败累计 2 次也亮横幅（隧道半路重拨时）
let _fails=0;
function noteFail(){if(++_fails>=2)setOffline(true);}
const _send=send;
add("您好！我是<b>中轴智游</b>，北京中轴线金牌讲解员。<br>📍 上方是<b>真实地图</b>：15 处遗产点可点，每个点都能问；下方五分类有模板提示词，点分类展开即问；📷 还能拍照识古建。我的每句话都标注<b>知识库来源</b>，没有可靠资料就诚实说不知道。","bot");
</script>
