<style>
:root{--red:#8f2b2f;--red2:#b5493f;--gold:#c9a227;--bg:#faf6f0;--ink:#2b2320;--mut:#8a7f76}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}

#mapwrap.folded #maptoggle .tg-state::after{content:"展开"}
#chat{padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
.row.me{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff;border:1px solid #e8dfd4}
.bub{padding:11px 14px;border-radius:14px;line-height:1.75;font-size:14.5px;overflow-wrap:break-word;max-width:100%}

.src{margin-top:9px;padding-top:7px;border-top:1px dashed #e5d9c9;font-size:12px;color:var(--mut)}
.src b{color:var(--red)}
.tblwrap{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f5ece0}
.tbl th,.tbl td{border:1px solid #e2d5c2;padding:5px 7px;text-align:left}

.tmpl{background:#fffdf8;border:1px dashed #d9b48f;color:#7c3f21;border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-align:left}

.kbmap{margin:4px 0 8px;border:1px solid #e2cfc0;border-radius:10px;overflow:hidden}

.kb{display:block;width:100%;text-align:left;background:#fffdf8;border:none;border-top:1px dashed #e2cfc0;padding:8px 12px;font-size:12.5px;color:var(--ink);cursor:pointer}
.kb:hover{background:#fdf0e3}
.kb b{color:var(--red)}

.kbchip:hover{background:#fdf0e3}
.kbchip.on{background:#8f2b2f;border-color:#8f2b2f;color:#fff}

.chip:hover{background:#fdf3ec}
#bar{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-width:848px;margin:0 auto;width:100%;position:sticky;bottom:0;background:var(--bg);z-index:500}
#inp{flex:1;border:1.5px solid #d9c8b4;border-radius:12px;padding:11px 14px;font-size:16px;outline:none;background:#fff;min-width:0}

.fups{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.fup:hover{background:#fdf0e3;border-style:solid}
.lensline{display:inline-block;background:#f5ece0;color:#7c3f21;border-radius:6px;padding:1px 7px;font-size:11.5px;margin-bottom:6px}
.mapjump{display:inline-block;margin-top:8px;background:#fff;border:1px solid #e2cfc0;color:var(--red);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
@media (max-width:640px){
 #mapwrap{padding:8px 10px 0}

 #map{height:300px}

 #catpanel{padding:2px 10px 6px}

 #bar{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}

 .bub{max-width:88vw}
 .tmpl,.fup,.chip,.mkbtn{min-height:44px}

@media (min-width:1450px){

#offbar{display:none;max-width:848px;margin:0 auto;width:100%;padding:0 14px 8px}

</style>

function fillInput(text){const i=$("inp");i.value=text;i.focus();
  try{i.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  try{i.setSelectionRange(i.value.indexOf("【")>=0?i.value.indexOf("【"):0,i.value.indexOf("】")>=0?i.value.indexOf("】")+1:i.value.length)}catch(e){}}
async function send(q,lensOverride){
 const lens=lensOverride||curLens;
 add(esc(q),"me");
 const t=document.createElement("div");t.className="row bot";t.innerHTML='<div class="av">🏯</div><div class="bub">轴轴正在翻书找答案…</div>';chat.appendChild(t);scrollChat(t);
 try{
  // v2.7.18：ngrok-skip-browser-warning 穿透 ngrok 免费版浏览器警告页
  // （POST问答/GET config 均带；CORS预检由后端放行该头。老师浏览器零配置直达）
  const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true"},
   body:JSON.stringify({message:q,history:history.slice(-10),session_id:SID,lens:lens})});
  const d=await r.json();t.remove();
  if(d.error){add("❌ "+esc(d.error),"bot");return;}
  let h="";
  const retLens=(d.meta&&d.meta.lens)||lens;
  if(retLens&&LENS_LABEL[retLens])h+="<span class='lensline'>"+LENS_LABEL[retLens]+"作答</span><br>";
  h+=fmt(d.answer||"");
  if(d.image){h="<img src='"+API+esc(d.image)+"' style='max-width:100%;border-radius:10px;display:block;margin-bottom:8px'>"+h;}
  const m=d.meta||{};
  const focusName=m.focus;
  if(focusName&&byName[focusName]){h+="<br><button class='mapjump' data-spot='"+esc(focusName)+"'>📍 地图上看看"+esc(focusName)+"</button>";}
  const row=add(h,"bot");
  const jb=row.querySelector(".mapjump");
  // v2.7.12：地图默认收起了，点"地图上看看"先自动展开再飞过去
  function openMap(){const w=document.getElementById("mapwrap");
   if(w&&w.classList.contains("folded")){w.classList.remove("folded");
    const b=document.getElementById("maptoggle");
    if(b&&b.querySelector(".tg-state"))b.querySelector(".tg-state").textContent="（已展开，点我收起";
    if(window._leaflet_map){try{setTimeout(()=>window._leaflet_map.invalidateSize(),50);}catch(e){}}}}
  if(jb)jb.onclick=()=>{openMap();flyToSpot(jb.getAttribute("data-spot"));document.getElementById("mapwrap").scrollIntoView({behavior:"smooth",block:"start"});};
  if(focusName){openMap();flyToSpot(focusName);}
  if(m.focus&&d.intent!=="story"){const r2=document.createElement("div");r2.className="row bot";
   r2.innerHTML='<div class="av">🏯</div><div class="bub" style="background:transparent;border:none;padding:2px 0"><button class="chip">📖 听《'+esc(m.focus)+"》的故事</button></div>";
   r2.querySelector("button").onclick=()=>send("给我讲讲"+m.focus+"的历史故事");
   chat.appendChild(r2);scrollChat(r2);}
  const fups=d.followups||[];
  if(fups.length){const r3=document.createElement("div");r3.className="row bot";
   r3.innerHTML='<div class="av">🏯</div><div class="bub" style="background:transparent;border:none;padding:2px 0"><div class="fups"></div></div>';
   const box=r3.querySelector(".fups");
   fups.forEach(f=>{const b=document.createElement("button");b.className="fup";b.textContent="💬 "+f.label;b.title=f.q;b.onclick=()=>send(f.q);box.appendChild(b);});
   chat.appendChild(r3);scrollChat(r3);}
  history.push({role:"user",content:q},{role:"assistant",content:d.answer});
 }catch(e){t.remove();noteFail();add("❌ 网络异常或服务未响应（当前服务地址 "+esc(API)+"）。<a href='./offline.html' style='color:#8f2b2f'>点此切换离线知识版</a>，或在网址后加 ?api=新地址 重试。","bot");}
}
// —— 地图折叠（v2.7.12：全端默认收起省屏，点则展开；展开后重绘防瓦片错位） ——
(function(){const w=$("mapwrap"),b=$("maptoggle");if(!w||!b)return;
 w.classList.add("folded");
 b.querySelector(".tg-state").textContent="（已收起，点我";
 b.onclick=()=>{const f=w.classList.toggle("folded");
  b.querySelector(".tg-state").textContent=f?"（已收起，点我":"（已展开，点我收起";
  if(!f&&window._leaflet_map){try{setTimeout(()=>window._leaflet_map.invalidateSize(),50);}catch(e){}}

(function(){
 const bar=$("catbar"),panel=$("catpanel");
 DATA.cats.forEach((c,idx)=>{
  const b=document.createElement("button");b.className="catbtn"+(idx===0?" on":"");
  b.innerHTML=c.icon+"<b>"+esc(c.name)+"</b><span>"+esc(c.desc)+"</span>";
  b.onclick=()=>{curLens=c.id;bar.querySelectorAll(".catbtn").forEach(x=>x.className="catbtn");b.className="catbtn on";showCat(c);};
  bar.appendChild(b);});
 function showCat(c){panel.innerHTML="";
  const d=document.createElement("div");d.className="catdesc";
  d.textContent=c.icon+" "+c.name+" · "+c.desc+"：点模板把提问填进输入框，改好【】里的词再发送。";
  panel.appendChild(d);
  // —— 课本板块课堂地图（v2.7.8）：35 篇目录级核验课文，点条目即问（问法均经引擎命中验证）
  // —— v2.7.12 一屏一事：课堂地图默认收起（手机上不再全铺），想看点开 ——
  // —— v2.7.13 两级筛选：先选学段→再选学科，条目渐进呈现；高中诚实空位（暂无核验条目，不编造） ——
  if(c.id==="textbook"&&typeof KBMAP!=="undefined"){
   const km=document.createElement("details");km.className="kbmap";km.open=false;
   const sm=document.createElement("summary");sm.textContent="📖 课堂地图：先选学段，再选学科（35 篇核验课文 × 中轴线，点条目填入输入框）";
   km.appendChild(sm);
   const grps=(typeof KBGROUPS!=="undefined")?KBGROUPS:[["low","🌱 小学低段"],["high","🌳 小学高段"],["mid","🎓 初中"],["hig","📚 高中"]];
   const gradeShort={low:"🌱 小学低段",high:"🌳 小学高段",mid:"🎓 初中",hig:"📚 高中"};
   let kbG="low",kbS="全部";
   const gradeRow=document.createElement("div");gradeRow.className="kbfilt";
   const subjRow=document.createElement("div");subjRow.className="kbfilt";
   const kbList=document.createElement("div");
   const kbSubjects=g=>{const s=[];KBMAP.filter(k=>k.g===g).forEach(k=>{if(s.indexOf(k.d)<0)s.push(k.d)});return s;};
   function kbRender(){
    gradeRow.querySelectorAll("button").forEach(b=>{b.className="kbchip"+(b.dataset.g===kbG?" on":"");});
    subjRow.innerHTML="";kbList.innerHTML="";
    const subs=kbSubjects(kbG);
    if(!subs.length){
     const h=document.createElement("div");h.className="kbhint";
     h.textContent="📚 该学段暂无目录级核验条目：待后续核验后补充，这里不编条目。";
     kbList.appendChild(h);return;}
    if(subs.indexOf(kbS)<0)kbS="全部";
    const all=document.createElement("button");all.className="kbchip"+(kbS==="全部"?" on":"");all.textContent="全部";
    all.onclick=()=>{kbS="全部";kbRender();};subjRow.appendChild(all);
    subs.forEach(s=>{const b=document.createElement("button");b.className="kbchip"+(s===kbS?" on":"");b.textContent=s;
     b.onclick=()=>{kbS=s;kbRender();};subjRow.appendChild(b);});
    KBMAP.filter(k=>k.g===kbG&&(kbS==="全部"||k.d===kbS)).forEach(k=>{const b=document.createElement("button");b.className="kb";
     b.innerHTML="<b>"+esc(k.t)+"</b> → "+esc(k.s);b.title=k.q;
     b.onclick=()=>{curLens=c.id;fillInput(k.q);};kbList.appendChild(b);});}
   grps.forEach(gr=>{const b=document.createElement("button");b.className="kbchip";b.dataset.g=gr[0];
    b.textContent=gradeShort[gr[0]]||gr[1];
    b.onclick=()=>{kbG=gr[0];kbS="全部";kbRender();};gradeRow.appendChild(b);});
   km.appendChild(gradeRow);km.appendChild(subjRow);km.appendChild(kbList);
   kbRender();
   panel.appendChild(km);}
  // —— v2.7.12 一屏一事：模板区包进折叠块，默认收起（标题行显示条数），手机上不再全堆 ——
  const tw=document.createElement("details");tw.className="tmplwrap";tw.open=false;
  const ts=document.createElement("summary");ts.textContent="📝 提问模板（"+c.templates.length+" 个，点开展开，点条目填入输入框）";
  tw.appendChild(ts);
  const w=document.createElement("div");w.className="tmpls";
  c.templates.forEach(t=>{const m=document.createElement("button");m.className="tmpl";m.textContent="💬 "+t.label;
   m.title=t.q;m.textContent="📝 "+t.label;m.onclick=()=>{curLens=c.id;fillInput(t.fill||t.q);};w.appendChild(m);});
  tw.appendChild(w);panel.appendChild(tw);}
 curLens=DATA.cats[0].id;
 showCat(DATA.cats[0]);
})();
