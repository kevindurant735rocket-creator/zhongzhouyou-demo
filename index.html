function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s){const lines=String(s).split("\n");let out="",i=0;
 while(i<lines.length){const L=lines[i];
  if(/^\s*\|/.test(L)){let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i].trim());i++}
   let h="<table class='tbl'>";rows.forEach((r,j)=>{if(/^[\s|:\-]+$/.test(r))return;
    const cells=r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
    h+="<tr>"+cells.map(c=>(j===0?"<th>":"<td>")+fmt2(c)+"</"+(j===0?"th":"td")+">").join("")+"</tr>"});
   out+=h+"</table>";continue;}
  out+=fmt2(L)+"<br>";i++;}
 return out.replace(/(<br>)+$/,"");}

   chat.appendChild(r2);}
  history.push({role:"user",content:q},{role:"assistant",content:d.answer});
