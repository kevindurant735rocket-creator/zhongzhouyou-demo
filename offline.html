<title>中轴智游 · 离线演示版</title>
<style>
:root{--red:#8f2b2f;--red2:#b5493f;--gold:#c9a227;--bg:#faf6f0;--ink:#2b2320;--mut:#8a7f76}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
h1{font-size:19px;letter-spacing:1px}
.sub{font-size:12px;opacity:.92;margin-top:2px}
.badge{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);padding:4px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
.row.me{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff;border:1px solid #e8dfd4}
.bub{padding:11px 14px;border-radius:14px;line-height:1.75;font-size:14.5px;overflow-wrap:break-word}
.bot .bub{background:#fff;border:1px solid #eadfd2;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.me .bub{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-top-right-radius:4px}
.src{margin-top:9px;padding-top:7px;border-top:1px dashed #e5d9c9;font-size:12px;color:var(--mut)}
.src b{color:var(--red)}
.tblwrap{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f5ece0}
.tbl th,.tbl td{border:1px solid #e2d5c2;padding:5px 7px;text-align:left}
.chip{background:#fff;border:1px solid #e2cfc0;color:var(--red);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{background:#fdf3ec}

.catbar::-webkit-scrollbar{display:none}

.catbtn b{display:block;font-size:13.5px;color:var(--red)}
.catbtn span{font-size:11px;color:var(--mut)}
.catbtn.on{background:#fdf0e8;border-color:var(--red2);box-shadow:0 1px 5px rgba(143,43,47,.15)}
#catpanel{max-width:848px;margin:0 auto;width:100%;padding:2px 14px 6px}
.catdesc{font-size:12px;color:var(--mut);padding:6px 2px 4px}
.tmpls{display:flex;gap:8px;flex-wrap:wrap}
.tmplwrap{margin:4px 0 8px;border:1px solid #e2cfc0;border-radius:10px;overflow:hidden}
.tmplwrap summary{cursor:pointer;background:#fdf6ee;font-size:12.5px;color:#7c3f21;padding:8px 12px}
.tmpl{background:#fffdf8;border:1px dashed #d9b48f;color:#7c3f21;border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-align:left}
.tmpl:hover{background:#fdf0e3;border-style:solid}
.kbmap{margin:4px 0 8px;border:1px solid #e2cfc0;border-radius:10px;overflow:hidden}
.kbmap summary{cursor:pointer;background:#f5ece0;font-size:12.5px;color:#7c3f21;padding:8px 12px}
.kb{display:block;width:100%;text-align:left;background:#fffdf8;border:none;border-top:1px dashed #e2cfc0;padding:8px 12px;font-size:12.5px;color:#2b2320;cursor:pointer}
.kb:hover{background:#fdf0e3}
.kb b{color:#8f2b2f}
.kbfilt{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px 4px}
.kbchip{background:#fff;border:1px solid #e2cfc0;color:#7c3f21;border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.kbchip:hover{background:#fdf0e3}
.kbchip.on{background:#8f2b2f;border-color:#8f2b2f;color:#fff}
.kbhint{font-size:12.5px;color:#7c3f21;background:#fdf6ee;border-top:1px dashed #e2cfc0;padding:10px 12px;line-height:1.7}
#bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-width:848px;margin:0 auto;width:100%}

#inp:focus{border-color:var(--red2)}

.fups{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fup{background:#fffdf8;border:1px dashed #d9b48f;color:#7c3f21;border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-align:left}
.fup:hover{background:#fdf0e3;border-style:solid}
.lensline{display:inline-block;background:#f5ece0;color:#7c3f21;border-radius:6px;padding:1px 7px;font-size:11.5px;margin-bottom:6px}
@media (max-width:640px){

<script>
const DATA={"chunks":[{"file":"00_总览.md","title":"00_总览.md","text":"> 知识库来源声明：本知识库由创作者依据北京市文物局、新华网、央视网、北京中轴线申遗保护工作官方平台(bjaxiscloud.com.cn)等公开权威资料自行整理，每条数据标注来源，供\"中轴智游\"智能体检索引用。\n> 知识库文件：00_总览、01-15_遗产点分册、16_建筑形制术语表、17_历史沿革时间线、18_民俗与礼仪文化、19_高频问答对FAQ、20_路线规划素材、21_景点故事分册、22_教材关联分册(共9个文档，建议按分片≤800字导入Coze知识库)。"},{"file":"00_总览.md","title":"一、基本信息(必答事实，均经核实)","text":"- **列入《世界遗产名录》时间**:2024年7月27日，联合国教科文组织第46届世界遗产大会(印度新德里)\n- **遗产全称**:\"北京中轴线——中国理想都城秩序的杰作\"\n- **中国世界遗产总数**:增至59项\n- **申遗历程**:2012年列入《中国世界文化遗产预备名单》,历时12年\n- **规模**:全长7.8公里，遗产区589公顷，缓冲区4542公顷\n- **遗产构成**:15处遗产构成要素，北起钟鼓楼，南至永定门"},{"file":"00_总览.md","title":"二、15处遗产构成要素(自北向南)","text":"| 序号 | 名称 | 位置段 | 一句话定位 |\n|---|---|---|---|\n| 1 | 钟鼓楼 | 北端 | 元明清三代的报时中心，\"暮鼓晨钟\" |\n| 2 | 万宁桥 | 北段 | 元代始建的单孔石拱桥，中轴线上最古老的桥梁，至今通行 |\n| 3 | 景山 | 北段 | 明清皇家御苑，中轴线制高点，可俯瞰故宫全景 |\n| 4 | 故宫(紫禁城) | 中段 | 明清两代皇宫，世界现存规模最大、保存最完整的木结构宫殿建筑群 |\n| 5 | 端门 | 中段 | 皇城正门天安门与故宫之间的礼仪门 |\n| 6 | 天安门 | 中段 | 皇城正门，明清颁诏之所，1949年开国大典举办地 |\n| 7 | 外金水桥 | 中段 | 天安门前七座石拱桥群 |\n| 8 | 天安门广场及建筑群 | 中段 | 人民英雄纪念碑、毛主席纪念堂、人民大会堂、国家博物馆 |\n\n| 序号 | 名称 | 位置段 | 一句话定位 |\n|---|---|---|---|\n| 9 | 太庙 | 中段东 | 明清皇家祖庙，\"左祖\",今劳动人民文化宫 |\n| 10 | 社稷坛 | 中段西 | 明清皇家祭祀土神谷神之所，\"右社\",五色土，今中山公园 |\n| 11 | 中轴线南段道路遗存 | 南段 | 2004/2022年考古揭露的明清御道遗存，实证南段完整走向 |\n| 12 | 天坛 | 南段东 | 明清皇帝祭天场所，祈年殿为标志 |\n| 13 | 先农坛 | 南段西 | 明清皇帝亲耕耤田、祭祀先农之所，\"一亩三分地\"典故来源 |\n| 14 | 正阳门 | 南段 | 内城正门，城楼与箭楼均存，俗称\"前门\" |\n| 15 | 永定门 | 南端 | 外城正门，2004年依据史料复建，中轴线南端起点 |"},{"file":"00_总览.md","title":"三、\"中轴线\"核心理念(讲解必用)","text":"- **《周礼·考工记》**:\"匠人营国，方九里，旁三门;国中九经九纬，经涂九轨;左祖右社，面朝后市\"——中轴线是中国古代都城\"以中为尊\"理想秩序的集大成体现。\n- **对称格局**:太庙(左祖)与社稷坛(右社)分列故宫前方东西;天坛与先农坛对称于南段两侧。\n- **时间与空间秩序**:晨钟暮鼓定时间，宫城居中定空间，体现了\"择中而立、象天法地\"的都城营建哲学。\n- **梁思成评价**:梁思成先生曾称北京中轴线是\"全世界最长、也最伟大的南北中轴线穿过全城\",\"北京独有的壮美秩序就由这条中轴的建立而产生\"(转引自公开报道，出处见 FAQ Q17)。"},{"file":"00_总览.md","title":"四、实用信息(回答游客高频问题)","text":"- **开放情况(提示用户以官方最新公告为准)**:故宫周一闭馆(法定节假日除外),需提前实名预约;天坛、景山、钟鼓楼、永定门城楼等常规开放;天安门广场需预约。\n- **经典游览动线(全程约7.8公里)**:半日精华线(永定门→先农坛→天坛→前门→天安门→故宫→景山);一日深度线(钟鼓楼→万宁桥→景山→故宫→天安门→太庙/社稷坛→前门→天坛/先农坛)。\n- **交通**:地铁8号线纵贯北段;2号线、7号线可达前门;沿线多段可骑行。"},{"file":"00_总览.md","title":"五、答问边界与伦理规则(智能体行为约束，详见提示词)","text":"1. 只依据本知识库及检索到的权威来源回答；知识库没有的信息，涉及传闻或诱导性\"发现\"的坚决拒绝，普通问题可基于通用知识回答但开头标注【通用知识回答·非知识库】，一律不编造。\n2. 涉及开放时间、票价、预约政策等时效信息，必须提示用户\"以官方最新公告为准\"。\n3. 不对文物真伪、争议性学术问题下断言，呈现多方观点。\n4. 不存储、不索要用户人脸照片;拍照识古建功能只分析建筑本身。\n5. 遇到用户指正错误时，致谢并记录反馈，不做无据辩护。"},{"file":"01-15_遗产点分册.md","title":"01-15_遗产点分册.md","text":"> 来源标注：【文】=北京市文物局申遗公布资料;【新】=新华网;【央】=央视网;【通】=各景点官方通行介绍。条目内容为公开权威资料整理，时效类信息以官方最新公告为准。\n\n---"},{"file":"01-15_遗产点分册.md","title":"1. 钟鼓楼【文】","text":"位于中轴线最北端，由钟楼、鼓楼两座建筑组成，元明清三代的城市报时中心。鼓楼置更鼓，钟楼悬铜钟，\"暮鼓晨钟\"规律报时，全城作息由此调度。它是中轴线上\"时间秩序\"的象征——整座都城先有统一的时间，再有统一的节奏。现开放登楼，可俯瞰什刹海片区。小贴士：鼓楼内有击鼓表演场次，入场前查询当日安排。"},{"file":"01-15_遗产点分册.md","title":"2. 万宁桥【文】","text":"中轴线上现存最古老的建筑，元代始建(1285年前后),单孔石拱桥，跨玉河水系，是元代漕运入城的重要节点。桥下曾设澄清上闸控制什刹海(元代称积水潭)水位，\"桥闸一体\"，江南漕船可沿通惠河由此直抵大都城内。桥身两侧设镇水兽(趴蝮)，现存六尊，其中经鉴定为元代原物的仅桥东北雁翅一尊(颌下刻\"至元四年九月\"题记)，余五尊为明清补配，至今仍在\"值守\"；因地处地安门(俗称后门)之南，民间俗称\"后门桥\"。它是至今仍在通行使用的活态遗产。小贴士：桥面两侧即可看到镇水兽，注意保护，勿触摸攀爬。"},{"file":"01-15_遗产点分册.md","title":"3. 景山【文】","text":"明清皇家御苑，坐落于中轴线上，是全城的制高点。景山五亭中万春亭居中，登临可南望故宫金色屋顶全景、北望钟鼓楼——这是欣赏\"中轴线壮美秩序\"的最佳观景点。明代崇祯皇帝在此自缢的史事为它增添历史厚重感。小贴士：日落前一小时登顶，顺光看故宫全景最佳。"},{"file":"01-15_遗产点分册.md","title":"4. 故宫(紫禁城)【文】【通】","text":"明清两代皇宫(1420年建成),世界上现存规模最大、保存最完整的木结构宫殿建筑群，1987年即列入《世界遗产名录》。紫禁城占地约72万平方米，现有大小宫殿七十多座、房屋8700余间(另有9000余间的说法，因统计口径不同而异)，是明清两代24位皇帝居住与执政之所。沿中轴线布置午门、三大殿(太和殿、中和殿、保和殿)、后三宫、御花园、神武门，体现\"居中为尊\"。太和殿俗称\"金銮殿\"，是我国现存规模最大的木结构大殿，脊兽10只为全国孤例。周边关联：神武门外即为筒子河(紫禁城护城河)，建成于明永乐十八年(1420年)，河宽52米，条石垒砌驳岸，河水自西北流入、向东南流出至御河；过筒子河北望即景山，傍晚角楼与河面倒影相映，是经典摄影点。(来源：故宫博物院官网)小贴士：周一闭馆，须在\"故宫博物院\"官方渠道实名提前预约，旺季票务紧张。"},{"file":"01-15_遗产点分册.md","title":"5. 端门【文】","text":"皇城正门天安门与紫禁城午门之间的礼仪之门，明清出入宫城的重要门户，形制与天安门相近。端门不是午门——午门是紫禁城的正门(南门),端门在其北侧，两者功能不同：端门用于礼仪整队，午门用于颁朔(颁布历书)、献俘等大典；颁布诏书(金凤颁诏)在天安门举行，\"推出午门斩首\"是误传。端门至午门之间的狭长广场两侧存有朝房，是大典前仪仗整队候驾的场所。小贴士：从天安门向北走，依次经过端门、午门，体会\"门中有门\"的纵深礼制。"},{"file":"01-15_遗产点分册.md","title":"6. 天安门【文】","text":"皇城正门，始建于明永乐年间(初名承天门),清代改名天安门。明清两代在此举行\"颁诏\"大典;1949年10月1日开国大典在此举行，天安门由此成为国家象征。小贴士：广场登城楼需另行预约，注意随身物品安检规定。"},{"file":"01-15_遗产点分册.md","title":"7. 外金水桥【文】","text":"天安门前跨外金水河的七座石拱桥，中间五座对应天安门门洞，桥栏望柱雕蟠龙，与天安门浑然一体，是明清礼仪空间的重要组成部分。小贴士：拍摄天安门正面标准照，多以外金水桥为前景。"},{"file":"01-15_遗产点分册.md","title":"8. 天安门广场及建筑群【文】","text":"世界最大城市广场之一，中轴线上\"传统与现代\"的交汇点：人民英雄纪念碑、毛主席纪念堂居中，东侧中国国家博物馆，西侧人民大会堂。广场见证了开国大典等重大历史时刻。小贴士：进入广场需提前通过官方小程序预约，清晨升旗仪式需更早排队。"},{"file":"01-15_遗产点分册.md","title":"9. 太庙【文】","text":"明清皇家祖庙，今劳动人民文化宫，位于故宫东南方，是\"左祖右社\"格局的\"左祖\"。前殿为祭祀祖先的大殿，规模仅次于太和殿，金丝楠木梁架极为珍贵。小贴士：古柏林荫肃穆，游人少于故宫，是体会礼制建筑的好去处。"},{"file":"01-15_遗产点分册.md","title":"10. 社稷坛【文】","text":"明清皇家祭祀土神与谷神的坛庙，今中山公园，与太庙对称，是\"右社\"。坛上铺五色土(东青、南红、西白、北黑、中黄),象征\"普天之下莫非王土\"。孙中山先生纪念像坐落园内。小贴士：五色坛台在园内中部，参观动线可与太庙对称安排，理解\"左右对称\"的规划思想。"},{"file":"01-15_遗产点分册.md","title":"11. 中轴线南段道路遗存【文】【新】","text":"正阳门至永定门之间的古代居中道路遗存，2004年和2022年经考古发掘揭露，由三处遗址构成：珠市口南侧中轴道路排水沟渠遗址(可见清代居中道路西侧砖砌沟渠的位置与形制)、珠市口南侧中轴道路路肩及板沟遗址、永定门北侧石板道遗存(位于永定门以北约100米处)。遗存始建于明代，清末至民国时期因电车轨道铺设被部分掩埋。它们实证了南段居中御道的走向与位置，为7.8公里全线的历史真实性提供了关键实物证据。2023年公布为北京市文物保护单位(保护范围与批次信息以官方公告为准)。小贴士：遗存分布于现地面之下，可在永定门公园、珠市口一带结合说明牌探访，感受御道肌理与现代街市的叠合。"},{"file":"01-15_遗产点分册.md","title":"12. 天坛【文】【通】","text":"明清皇帝\"祭天\"\"祈谷\"的坛庙，始建于明永乐十八年(1420年),1998年列入《世界遗产名录》。天坛占地约273公顷，规模约为故宫的3.8倍(按占地面积估算)，是中国现存规模最大的古代祭祀建筑群。祈年殿三重檐攒尖顶不用大梁长檩，殿内28根楠木柱环绕排列：中央4根龙井柱象征四季，中层12根象征十二个月，外层12根象征十二时辰，把时间秩序\"写\"进了建筑；回音壁、圜丘体现古人对\"天圆地方\"与声学的理解。\"人天对话\"的坛庙与\"人间秩序\"的故宫一南一北呼应。小贴士：与先农坛一东一西对称，建议连游;祈年殿上午顺光拍照最佳。"},{"file":"01-15_遗产点分册.md","title":"13. 先农坛【文】","text":"明清皇帝祭祀先农神并亲行\"耤田礼\"的场所，皇帝在此扶犁耕种\"一亩三分地\"——该俗语正源于此。今设北京古代建筑博物馆，镇馆之宝为隆福寺藻井。小贴士：与天坛隔中轴线相望，\"东坛西庙\"对称格局是理解中轴规划的关键。"},{"file":"01-15_遗产点分册.md","title":"14. 正阳门【文】","text":"内城正门，俗称\"前门\",始建于明永乐年间。城楼与箭楼俱存，是中轴线上保存最完整的城门建筑组群，明清北京\"内九外七\"城门中规格最高者之一。小贴士：城楼可登，夜景亮灯后与前列大街合影最壮观;游客量大，注意错峰。"},{"file":"01-15_遗产点分册.md","title":"15. 永定门【文】","text":"外城正门，中轴线南端起点，始建于明嘉靖三十二年(1553年),1957年拆除，2004年依据史料与考古信息在原址复建，力求延续原有位置与形制。城楼复建是中轴线整体保护的重要标志事件，\"南望永定门、北看钟鼓楼\"重现完整7.8公里壮美秩序。今日永定门公园沿南中轴线开辟御道景观带，与中轴线南段道路遗存的展示相衔接，是走进中轴线南端的第一站。小贴士：永定门公园免费开放，晚上市民放风筝，是感受\"遗产融入生活\"的地方。"},{"file":"16_建筑形制术语表.md","title":"16_建筑形制术语表.md","text":"> 用途：当用户上传照片让智能体\"看图识古建\"时，用本表中的规范术语描述建筑特征，避免口语化误判。\n> 来源标注：【文】北京市文物局官网科普内容 【央】央视网/新华社申遗报道 【故】故宫博物院官网公开资料"},{"file":"16_建筑形制术语表.md","title":"一、屋顶形制（等级从高到低）","text":"| 形制 | 特征 | 中轴线上的代表 |\n|---|---|---|\n| 重檐庑殿顶 | 双层檐、四面坡、五条脊，最高等级 | 太和殿、乾清宫 |\n| 重檐歇山顶 | 双层檐、九条脊（一条正脊+四垂脊+四戗脊） | 天安门、保和殿 |\n| 单檐庑殿顶 | 单层檐四面坡 | 体仁阁、弘义阁等 |\n| 单檐歇山顶 | 单层檐九脊 | 大量配殿、太庙部分殿宇 |\n| 攒尖顶 | 无正脊，宝顶居中，圆形或四角/八角 | 中和殿（四角攒尖）、祈年殿（三重檐圆攒尖） |\n| 卷棚顶 | 屋脊弧形无正脊，多用于园林 | 景山部分亭榭 |"},{"file":"16_建筑形制术语表.md","title":"二、看图判断三步法（智能体输出\"识别卡片\"的逻辑）","text":"1. **数檐**：双层檐→重檐（等级高，大概率是主体大殿或城楼）。\n2. **看脊**：四面坡无山墙→庑殿；侧面有山花→歇山；顶部收成一点→攒尖。\n3. **数走兽**：屋脊前端的小兽，数量越多等级越高。太和殿10只（行什为第10只，全国孤例），一般宫殿9只以下，按 3、5、7、9 奇数递减。"},{"file":"16_建筑形制术语表.md","title":"三、高频构件术语（上）","text":"- **脊兽/仙人走兽**：垂脊下端的排兽，首为骑凤仙人，后随龙、凤、狮子、天马、海马、狻猊、狎鱼、獬豸、斗牛、行什（仅太和殿）。\n- **斗拱**：柱顶屋檐下层层出挑的木构件，既承重又体现等级；同一时期出跳层数越多等级越高。看年代有个诀窍：年代越早的斗拱越硕大疏朗（如唐宋），明清斗拱渐趋细密繁复、装饰性增强。\n- **和玺彩画**：龙凤图案金碧彩画，最高等级（太和殿等）；**旋子彩画**次之；**苏式彩画**多见于园林。\n- **须弥座**：叠涩式高台基，常刻圭角、莲花瓣，皇家建筑标配。"},{"file":"16_建筑形制术语表.md","title":"三、高频构件术语（下）","text":"- **丹陛石/御路**：台阶中央雕龙刻云的石板，皇帝车驾专用。\n- **鸱吻/正吻**：正脊两端的龙形吞脊兽，传说可镇火。\n- **镇水兽**：趴蝮（bā xià），龙生九子之一，常见于桥边水畔。万宁桥现存六尊镇水兽（元代以来陆续安放，其中仅桥东北雁翅一尊经鉴定为元代原物，余为明清补配），是\"桥闸一体\"的水工见证。"},{"file":"16_建筑形制术语表.md","title":"四、识别置信度说明（配合系统提示词的输出格式）","text":"照片识别受角度、光线、遮挡影响。输出时必须包含\"依据\"（看到了哪个特征：檐数/脊型/脊兽数）与\"置信度\"（高/中/低），并提示用户\"如需确认请结合现场说明牌或官方导览资料\"。不得仅凭一张照片断言具体建筑名称。"},{"file":"17_历史沿革时间线.md","title":"17_历史沿革时间线.md","text":"> 用途：回答\"中轴线是什么时候形成的\"\"为什么是这个形状\"类背景题。\n> 来源：【文】北京市文物局 【央】央视网/新华社申遗报道 【遗】《北京中轴线申遗文本》（公开报道转述）"},{"file":"17_历史沿革时间线.md","title":"17_历史沿革时间线.md","text":"- **元1267年**：元世祖忽必烈营建元大都，刘秉忠主持规划，以积水潭东岸定为城市中轴，确立\"以中为尊\"的都城骨架。\n- **明永乐四年（1406）**：朱棣下诏营建北京；**永乐十八年（1420）**基本建成，紫禁城、太庙、社稷坛、天坛、钟鼓楼落成，中轴线格局成形（万宁桥为元代旧物，沿用为轴上节点）。\n- **明嘉靖三十二年（1553）**：加筑外城，将南郊天坛、先农坛包入城内，中轴线向南延伸至永定门，全长约7.8公里的格局至此定型。\n- **清代**：沿用明代中轴，修缮并增建部分殿宇（如景山寿皇殿建筑群），格局不变——\"一条中轴线，两朝营建，七百年传承\"。\n- **1912年后**：皇城禁地逐步开放；正阳门地区改造，清末至民国间南段御道因电车轨道铺设被部分掩埋。\n- **1949年**：开国大典在天安门举行，天安门广场及建筑群成为中轴线上的新节点（人民英雄纪念碑1958年、毛主席纪念堂1977年）。\n- **2011年**：北京中轴线申遗工作启动。\n- **2012年**：列入《中国世界文化遗产预备名单》。\n- **2022年**：5月25日北京市人大常委会通过《北京中轴线文化遗产保护条例》，同年10月1日起施行，为中轴线保护与申遗提供法治保障。\n- **2025年5月30日**：北京市人大常委会通过《北京中轴线世界文化遗产保护条例》，自公布之日起施行；原《北京中轴线文化遗产保护条例》同时废止——这是申遗成功后的专项立法升级，回答法规类问题时注意两部条例的时效区分。\n- **2023年**：中轴线南段道路遗存、正阳桥遗址公布为北京市文物保护单位（批次信息以官方公告为准）。\n- **2024年7月27日**：在印度新德里举行的第46届世界遗产大会上，\"北京中轴线——中国理想都城秩序的杰作\"列入《世界遗产名录》，成为中国第59项世界遗产。\n- **申遗成功一周年（202"},{"file":"17_历史沿革时间线.md","title":"17_历史沿革时间线.md","text":"5年7月）**：遗产区对外开放与活化利用持续推进，各区推出主题漫步线路与数字化展示。"},{"file":"17_历史沿革时间线.md","title":"一句话答题模板","text":"\"北京中轴线始建于13世纪的元大都，成形于1420年明代永乐年间，定型于1553年外城修筑之后，2024年7月27日列入《世界遗产名录》。\""},{"file":"18_民俗与礼仪文化.md","title":"18_民俗与礼仪文化.md","text":"> 用途：让导览\"有人味儿\"——回答文化类追问（钟鼓报时、耤田礼、五色土寓意等），也是讲解卡片的加分素材。\n> 来源：【文】北京市文物局/先农坛（北京古代建筑博物馆）公开资料 【央】央视网报道 【遗】申遗文本转述"},{"file":"18_民俗与礼仪文化.md","title":"一、暮鼓晨钟：古代北京的\"标准时间\"","text":"- 清代钦天监确定时刻，鼓楼定更击鼓、钟楼撞钟：定更（戌时）后钟鼓齐鸣，次日五更钟鸣开城门。\n- \"暮鼓晨钟\"是全城作息的号令，也是中轴线作为\"时间轴\"的功能体现——钟鼓楼位于最北端，正合\"北为终、为藏\"的传统观念。"},{"file":"18_民俗与礼仪文化.md","title":"二、左祖右社：儒家都城理想","text":"- 《周礼·考工记》：\"匠人营国，方九里，旁三门。国中九经九纬，经涂九轨。左祖右社，面朝后市。\"\n- 北京中轴线是这一理想的实物标本：**左（东）为太庙**祭祖，**右（西）为社稷坛**祭土谷，**面朝（南）**有朝廷宫城，**后市（北）**有钟鼓楼一带市井。\n- 梁思成评价：\"北京独有的壮美秩序就由这条中轴的建立而产生。\""},{"file":"18_民俗与礼仪文化.md","title":"三、一亩三分地：皇帝的\"亲耕秀\"","text":"- 先农坛内有一块\"耤田\"（俗称一亩三分地），明清皇帝春季行耤田礼，亲自扶犁三推三返，以示重农。\n- \"一亩三分地\"的俗语即源于此（原指皇帝自留的这块地）。\n- 现由北京古代建筑博物馆管理展示，可实地观看。"},{"file":"18_民俗与礼仪文化.md","title":"四、五色土：普天之下莫非王土","text":"- 社稷坛祭坛铺五色土：**东青、南红、西白、北黑、中黄**，对应五行五方，象征\"普天之下莫非王土\"。\n- 祭社稷即祭土神与谷神，祈求风调雨顺、江山永固。"},{"file":"18_民俗与礼仪文化.md","title":"五、镇水兽与桥闸：万宁桥的市井记忆","text":"- 万宁桥（后门桥）始建于元至元二十二年（1285），是中轴线上最古老的遗存之一，桥下澄清上闸曾控制积水潭水位，\"桥闸一体\"。\n- 桥岸现存六尊镇水兽（趴蝮），其中仅桥东北雁翅一尊经鉴定为元代原物（颌下刻\"至元四年九月\"题记），余五尊为明清补配；这尊被往来百姓摸得发亮，是中轴线上\"能摸到元朝\"的地方。"},{"file":"18_民俗与礼仪文化.md","title":"六、五牌楼与正阳门：前门大街的商业民俗","text":"- 正阳门前曾有\"五牌楼\"，前门大街是老北京最繁华的商业街：老字号与大栅栏商铺云集。\n- 民谚\"前门楼子九丈九，四门三桥五牌楼\"，可作为讲解开场白素材。"},{"file":"18_民俗与礼仪文化.md","title":"七、中轴线上的京味小吃：逛吃地图（品类·无店名）","text":"- 逛中轴线不只看古建，沿线片区能把京味小吃吃全：**前门大街·大栅栏·鲜鱼口**（正阳门旁，北京烤鸭（正餐大菜，建议留足用餐时间）、爆肚、卤煮、炸酱面最集中）；**什刹海·后海**（毗邻万宁桥、钟鼓楼，湖畔餐食）；**南锣鼓巷**（毗邻景山、鼓楼，糖葫芦、驴打滚、艾窝窝、豌豆黄等北京小吃集中）；**牛街**（清真美食聚集，中轴线西南侧，地铁可达；清真餐食有饮食禁忌，请尊重店家习俗；豆汁儿配焦圈的老吃法沿线也能找到）。\n- 品类掌故一句话：爆肚讲究水爆火候、卤煮是老汤\"三转\"熬出来的、炸酱面看菜码齐不齐、豆汁儿配焦圈才地道、驴打滚裹的是黄豆面、艾窝窝与豌豆黄本是宫廷小吃、糖葫芦山楂去核才讲究。\n- 用餐动线：北段（钟鼓楼、万宁桥）就近什刹海一带，中段（故宫、天安门）选前门·大栅栏，南段（天坛、先农坛）可回前门或就近商圈。本节只写品类与片区、不点名具体店铺；营业时间、人均消费以点评平台与地图应用实时信息为准。"},{"file":"19_高频问答对FAQ.md","title":"19_高频问答对FAQ.md","text":"> 用途：游客最高频的 28 个问题，每条为\"标准问法+标准答法\"，供知识库精确召回，保证回答口径统一、事实一致。\n> 来源：【文】北京市文物局申遗公布资料【新】新华网【央】央视网【故】故宫博物院官网。时效类答案均带免责提示。\n> 分段说明：每条 Q&A 以 `## ` 标题分隔，确保 Coze 知识库按问答条目分段。\n---"},{"file":"19_高频问答对FAQ.md","title":"Q1 北京中轴线有多长?包括哪15处?","text":"全长7.8公里，北起钟鼓楼、南至永定门，15处遗产构成要素为：钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、天安门广场及建筑群、太庙、社稷坛、中轴线南段道路遗存、天坛、先农坛、正阳门、永定门。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q2 中轴线是什么时候申遗成功的?","text":"2024年7月27日，在印度新德里举行的联合国教科文组织第46届世界遗产大会上，\"北京中轴线——中国理想都城秩序的杰作\"列入《世界遗产名录》，成为中国第59项世界遗产。申遗工作2012年列入预备名单，历时12年。(来源：新华网)"},{"file":"19_高频问答对FAQ.md","title":"Q3 中轴线上最古老的建筑是哪座?","text":"万宁桥。元代始建(1285年前后)，单孔石拱桥，跨玉河水系，桥岸现存镇水兽六尊(元代原物仅桥东北一尊，余为明清补配)，至今仍在通行使用，是中轴线上最古老的\"活态遗产\"。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q4 景山为什么被称为最佳观景点?","text":"景山是中轴线制高点，万春亭登临可南望故宫金色屋顶全景、北望钟鼓楼，一条壮美秩序尽收眼底。建议日落前一小时登顶，顺光看故宫最佳。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q5 太和殿的脊兽为什么是10只?","text":"按古建等级，脊兽一般3、5、7、9只奇数递减，太和殿破例用满10只（行什为第10只，仅此一例），是全国孤例，代表最高等级；故宫中等级仅次于太和殿的保和殿为9只（排列到斗牛为止，没有行什）。注意计数口径：檐角最前端的\"骑凤仙人\"不算走兽，走兽从龙开始数，共10只：龙、凤、狮子、天马、海马、狻猊、狎鱼、獬豸、斗牛、行什。(来源：故宫博物院官网\"走兽\"词条 dpm.org.cn)"},{"file":"19_高频问答对FAQ.md","title":"Q6 故宫怎么预约?周几闭馆?","text":"周一闭馆(法定节假日除外)，须在\"故宫博物院\"官方渠道实名提前预约，旺季票务紧张。以官方最新公告为准。(来源：故宫博物院官网)"},{"file":"19_高频问答对FAQ.md","title":"Q7 天安门广场怎么进?","text":"进入广场需提前通过官方小程序预约；清晨看升旗仪式需更早排队安检。以官方最新公告为准。(来源：天安门地区管理委员会)"},{"file":"19_高频问答对FAQ.md","title":"Q8 \"左祖右社\"是什么意思?","text":"出自《周礼·考工记》都城营建制度：宫殿前方左侧(东)建太庙祭祖、右侧(西)建社稷坛祭土谷之神。北京中轴线上太庙在东、社稷坛在西，正是这一理想的实物体现。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q9 社稷坛的五色土有什么讲究?","text":"坛上铺五色土：东青、南红、西白、北黑、中黄，对应五方五色，象征\"普天之下莫非王土\"。社稷坛在今中山公园内。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q10 \"一亩三分地\"这个俗语从哪来?","text":"源自先农坛的耤田礼：明清皇帝每年春在此祭祀先农神并亲扶犁耕种的一块田，面积恰为一亩三分，俗语由此流传。今先农坛设北京古代建筑博物馆，镇馆之宝为隆福寺藻井。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q11 中轴线南段御道是怎么发现的?","text":"2004年和2022年考古发掘揭露三处遗址：珠市口南侧中轴道路排水沟渠遗址、珠市口南侧中轴道路路肩及板沟遗址、永定门北侧石板道遗存(位于永定门以北约100米处)。御道始建于明代，清末至民国因电车轨道铺设被掩埋。这些遗存实证了南段居中御道的走向与位置，为7.8公里全线的历史真实性提供了关键实物证据，2023年公布为北京市文物保护单位(批次信息以官方公告为准)。(来源：北京市文物局、新华网)"},{"file":"19_高频问答对FAQ.md","title":"Q12 永定门是原建筑吗?","text":"始建于明嘉靖三十二年(1553年)，1957年拆除，2004年依据史料在原址复建。复建是中轴线整体保护的重要标志事件。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q13 天坛祈年殿有什么特别?","text":"始建于明永乐十八年(1420年)，三重檐攒尖顶不用大梁长檩，是中国古建筑力学杰作；回音壁、圜丘体现\"天圆地方\"观念。1998年列入《世界遗产名录》。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q14 钟鼓楼的\"暮鼓晨钟\"是什么制度?","text":"元明清三代的城市报时制度：黄昏击鼓定更、清晨鸣钟启城，全城作息由此调度，体现中轴线上的\"时间秩序\"。鼓楼内有击鼓表演场次，入场前查询当日安排。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q15 正阳门为什么叫\"前门\"?","text":"正阳门是内城正门，始建于明永乐年间，位于内城南墙正中、面朝前门大街，民间俗称\"前门\"。城楼与箭楼俱存，是中轴线上保存最完整的城门建筑组群。民谚\"前门楼子九丈九，四门三桥五牌楼\"即形容其气象。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q16 万宁桥的镇水兽是什么?","text":"趴蝮(bā xià)，传说中龙生九子之一，喜水，古人置于桥边水畔镇水护桥。万宁桥现存镇水兽六尊，其中经鉴定为元代原物的仅桥东北雁翅一尊（颌下刻\"至元四年九月\"题记），余五尊为明清补配，是\"桥闸一体\"水工设施的见证。请勿触摸攀爬。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q17 梁思成怎么评价北京中轴线?","text":"梁思成先生称北京中轴线是\"全世界最长、也最伟大的南北中轴线穿过全城\"，\"北京独有的壮美秩序就由这条中轴的建立而产生\"。(来源：梁思成《北京——都市计划的无比杰作》)"},{"file":"19_高频问答对FAQ.md","title":"Q18 半天时间怎么游中轴线最合适?","text":"推荐精华线：永定门→先农坛→天坛→正阳门/前门→天安门广场→故宫→景山登顶俯瞰全轴。注意故宫需提前实名预约、周一闭馆。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)"},{"file":"19_高频问答对FAQ.md","title":"Q19 一天时间怎么安排?","text":"推荐深度线：上午钟鼓楼→万宁桥→景山→故宫；下午端门/天安门→太庙或社稷坛→前门大街；傍晚天坛或先农坛。地铁8号线纵贯北段，2号线/7号线达前门，沿线多段可骑行。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)"},{"file":"19_高频问答对FAQ.md","title":"Q20 带孩子游中轴线推荐哪条线?","text":"推荐北线：钟鼓楼(击鼓表演)→万宁桥找镇水兽→什刹海→景山登顶→故宫珍宝馆。节奏轻松、故事性强，适合亲子讲解。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)"},{"file":"19_高频问答对FAQ.md","title":"Q21 中轴线有什么保护法规?","text":"2022年5月25日北京市人大常委会通过《北京中轴线文化遗产保护条例》，同年10月1日起施行；申遗成功后，2025年5月30日又通过《北京中轴线世界文化遗产保护条例》，自公布之日起施行，原条例同时废止。回答时注意两部条例的时效区分。(来源：北京市人大常委会公开报道)"},{"file":"19_高频问答对FAQ.md","title":"Q22 沿线怎么坐地铁?","text":"地铁8号线大致沿中轴线敷设：什刹海站(钟鼓楼、万宁桥)、南锣鼓巷/中国美术馆站(景山、故宫东侧)、前门站(正阳门、天安门广场南)、天桥站、永定门外站(南段御道遗存、先农坛)；1号线天安门东站(天安门、国博)、2号线可达鼓楼大街站与前门站。换乘与运营信息以官方最新公告为准。(来源：综合北京市文物局及公开交通信息)"},{"file":"19_高频问答对FAQ.md","title":"Q23 景山公园几点开门?下午去来得及看日落吗?","text":"旺季(4月-10月)6:00开园、21:00闭园(20:30停止入园)，淡季(11月-3月)6:30开园、20:00闭园，万春亭随园开放；日落前一小时登顶看故宫效果最好。具体开放与售票安排以公园官方最新公告为准。(来源：北京市政务服务网公开信息)"},{"file":"19_高频问答对FAQ.md","title":"Q24 故宫和景山之间那条河是什么?有多宽?","text":"那是筒子河(紫禁城护城河)，明永乐十八年(1420年)建成，河宽52米，条石垒砌驳岸，河水自西北流入、向东南流出至御河；过筒子河北望即景山，傍晚角楼与河面倒影相映，是经典摄影点。(来源：故宫博物院官网)"},{"file":"19_高频问答对FAQ.md","title":"Q25 永定门最初是什么时候建的?","text":"永定门始建于明嘉靖三十二年(1553年)，是外城的正门、中轴线南端起点，寓意\"永远安定\"；1957年拆除，2004年依据史料与考古信息在原址复建，复建依据的是拆除前的老照片和历史测绘资料。(来源：北京市文物局)"},{"file":"19_高频问答对FAQ.md","title":"Q26 内金水桥和外金水桥有什么区别?","text":"两者都是横跨金水河的汉白玉石桥，位置和规制不同：外金水桥在天安门前(外金水河上)，共七座——正对天安门五个门洞的主桥五座(居中御路桥旧时仅皇帝通行，两侧为王公桥、品级桥)，另有太庙、社稷坛前各一座；内金水桥在故宫太和门前(内金水河上)，共五座。两桥均建于明永乐年间。(来源：天安门地区管委会官网、新京报)"},{"file":"19_高频问答对FAQ.md","title":"Q27 中轴线沿线去哪里吃饭?有什么京味小吃?","text":"沿线餐饮集中在几个片区：**前门大街·大栅栏·鲜鱼口**（正阳门旁，老字号最集中，北京烤鸭（正餐大菜，建议留足用餐时间）、爆肚、卤煮、炸酱面等京味小吃都能吃到）；**什刹海·后海**（毗邻万宁桥、钟鼓楼，有湖畔餐食与老字号）；**南锣鼓巷**（小吃街，毗邻景山、鼓楼，糖葫芦、驴打滚、艾窝窝、豌豆黄等北京小吃集中）；**牛街**（清真美食聚集，在中轴线西南侧，地铁可达；清真餐食有饮食禁忌，请尊重店家习俗；豆汁儿配焦圈的老吃法沿线也能找到）。用餐动线建议：北段（钟鼓楼、万宁桥）就近选什刹海一带，中段（故宫、天安门）选前门·大栅栏，南段（天坛、先农坛）可回前门或就近商圈。本条只写品类与片区、不点名具体店铺；各餐厅营业时间、排名与人均消费请以大众点评等点评平台及地图应用的实时信息为准。(来源：沿线餐饮片区为公开地理常识整理；具体店家信息以点评/地图平台实时数据为准)"},{"file":"19_高频问答对FAQ.md","title":"Q28 课本里学过中轴线吗?有哪些课文相关?","text":"有，三十多篇人教版/统编版教材课文与中轴线地点相关（目录级核验，课文原文、页码与配图以纸质教材为准）。小学：音乐一年级上册旧版第二单元欣赏《我爱北京天安门》（天安门；现行2024秋版目录查无此歌，仅对旧版年份成立）、旧版唱歌《国旗国旗真美丽》、第六单元《中华人民共和国国歌》（天安门广场升旗）；语文一年级下册第3课《我多想去看看》（想到天安门看升旗）、三年级下册第14课《赵州桥》（古桥对照万宁桥）、四年级上册第17课《长城》第18课《颐和园》与五年级上册第13课《圆明园的毁灭》（教学拓展对照，非中轴线）、六年级上册第6课《开国大典》（天安门广场）、六年级下册第1课《北京的春节》（老舍，北京旧城民俗）；道法一年级上册第2课《我向国旗敬个礼》（升旗联想）；美术五年级上册第7课《古朴精美的华表》、美术六年级下册第15课《我国古代建筑艺术》（疑旧版，实例待核对）。初中：语文七年级上册第1课《春》第2课《济南的冬天》、八年级上册第三单元山水写景课文（《三峡》《与朱元思书》等，篇目经纸质教材实拍核对）可做写景方法迁移（用课上学的观察方法看筒子河、角楼与景山，不是地点引用）；八年级上册第19课《中国石拱桥》（对照万宁桥）、第20课《苏州园林》（对照景山园林）、第21课《人民英雄永垂不朽》（广场纪念碑）；九年级上册第5课《你是人间的四月天》（林徽因，古建测绘保护视角）；历史七年级下册第15课《明朝的统治》（永乐营建北京、紫禁城落成）、八年级上册第17课《七七事变与全民族抗战》（卢沟桥拓展）、第11课《五四运动》（1919年天安门前集会游行）、八年级下册第1课《中华人民共和国成立》（天安门）；地理八年级下册第七章第四节《祖国的首都——北京》（旧教材疑为第六章，现行已前移）；音乐七年级上册《中华人民共和国国歌》与第三单元\"歌唱我们的祖国\"项目（"},{"file":"19_高频问答对FAQ.md","title":"Q28 课本里学过中轴线吗?有哪些课文相关?","text":"单篇曲目待纸质核对）；数学八年级上册第十五章《轴对称》、物理八年级上册第二章《声现象》仅为课堂联想（对称格局/回音壁），不是课文正文引用（旧版分册误作数学\"第十三章\"，现按目录更正）。高中：语文必修上册第14课《故都的秋》（郁达夫）、课内略读《*荷塘月色》、第15课《我与地坛（节选）》（史铁生，地坛坛庙礼制对照，非中轴线）；历史纲要（上）第25课《中华人民共和国成立和向社会主义的过渡》（天安门）、第12课《从明朝建立到清军入关》（紫禁城关联待纸质核对）；美术鉴赏第7课《华夏意匠》（实例待纸质核对）。其中数学八上《轴对称》、物理八上《声现象》两节已按\"课堂观察任务\"做细（对称格局三步观察/回音壁两步观察，见22_分册对应节），把课上知识带到实地用。查过但不入库的有：现行八上《故宫博物院》查无（已删除疑）、二年级《北京》已删除、国徽专项/初中美术故宫课/初中英语北京专文/高中《林黛玉进贾府》单篇/小学数学《图形的运动》现行目录均查无，详见《22_教材关联分册》\"查无说明\"。不同年份版本目录或有调整，以当年纸质教材为准；详细课堂衔接见《22_教材关联分册》。(来源：各册教材目录；史实口径以本库为准)"},{"file":"20_路线规划素材.md","title":"20_路线规划素材.md","text":"> 用途：路线规划工作流的 LLM 生成节点以本文件三张\"成品路线卡\"为基准模板，只做个性化微调，保证输出稳定、可复现(避免每次生成不同路线导致测试结果不一致)。\n> 时效信息(预约/票价/开放时间)一律以官方最新公告为准。\n> 时刻表说明：各点时刻为理想通行估算，未含排队、安检与预约入场等待，请提示用户预留机动时间。\n\n---"},{"file":"20_路线规划素材.md","title":"路线A · 半日精华线(约4.5小时，步行+地铁)","text":"| 时间 | 地点 | 看点 | 交通 |\n|---|---|---|---|\n| 09:00–09:40 | 永定门 | 中轴线南端起点，御道遗存 | 地铁14号线永定门外站 |\n| 09:50–10:50 | 先农坛 | 一亩三分地、隆福寺藻井 | 步行约1.2km |\n| 11:00–12:00 | 天坛 | 三重檐攒尖顶、回音壁 | 西门入东门出 |\n| 12:10–13:00 | 正阳门/前门 | 城楼箭楼、午餐 | 步行约1km |\n| 13:10–13:40 | 天安门广场 | 纪念碑(需广场预约) | 前门站 |\n| 13:40–14:30 | 故宫 | 午门→三大殿→神武门(需预约) | 午门进 |\n| 14:30–15:30 | 景山万春亭 | 登顶俯瞰中轴线全景 | 神武门对面 |\n\n提示：故宫周一闭馆、需实名预约。"},{"file":"20_路线规划素材.md","title":"路线B · 一日深度线(约8小时)","text":"| 时间 | 地点 | 看点 | 交通 |\n|---|---|---|---|\n| 09:00–10:00 | 钟鼓楼 | 暮鼓晨钟、击鼓表演 | 地铁8号线什刹海站 |\n| 10:10–10:40 | 万宁桥 | 元代镇水兽、最古老石拱桥 | 步行约600m |\n| 10:50–11:50 | 景山 | 万春亭南望故宫全景 | 步行 |\n| 12:00–15:00 | 故宫 | 中轴三殿+珍宝馆(含午餐) | 需预约，周一闭馆 |\n| 15:20–16:20 | 太庙或社稷坛 | 左祖右社对称格局 | 步行 |\n| 16:30–17:30 | 天安门广场 | 纪念碑、国博外观 | 需广场预约 |\n| 17:30–19:30 | 前门+正阳门 | 晚餐、夜景 | 步行/地铁2号线 |\n| 19:30–20:30 | 天坛夜景或返程 | 祈年殿夜色 | 地铁7/8号线 |\n\n提示：全天步行约10km,穿舒适的鞋;故宫票提前3–7天抢。"},{"file":"20_路线规划素材.md","title":"路线C · 亲子北线(约3.5小时，节奏轻松)","text":"| 时间 | 地点 | 看点 | 交通 |\n|---|---|---|---|\n| 09:30–10:20 | 钟鼓楼 | 击鼓表演+报时故事 | 地铁8号线什刹海站 |\n| 10:30–11:00 | 万宁桥 | \"寻找六尊镇水兽\"小游戏 | 步行约600m |\n| 11:00–12:00 | 什刹海湖畔 | 万宁桥水系讲解、午餐 | 步行 |\n| 13:00–13:50 | 景山 | 登万春亭\"数屋顶\"游戏 | 步行 |\n| 14:00–15:30 | 故宫(选看) | 太和殿数脊兽、找行什 | 需实名预约 |\n\n亲子讲解要点：多用\"找一找、数一数\"互动(数走兽、找五色土、数城门);全程避开长途步行段。\n\n---"},{"file":"20_路线规划素材.md","title":"规划硬规则(写进工作流生成节点)","text":"1. 路线必须自南向北或自北向南单向推进，避免回头路;\n2. 故宫、天安门广场两项预约类景点默认计入并标注\"需提前预约\",用户未确认预约时给出替代方案(故宫→太庙+景山替代深度游);\n3. 每点停留时长：广场/城楼30–40分钟，坛庙60分钟，故宫120–180分钟;\n4. 输出必须用四列表格(时间|地点|看点|交通),末尾附预约与天气提示(天气调用插件，不可用时写\"出行前请查询当日天气\");\n5. 用户时长不足半天时，推荐\"景山+故宫外围+前门\"微缩线并说明取舍原因。"},{"file":"21_景点故事分册.md","title":"21_景点故事分册.md","text":"> 用途：支撑\"听景点故事\"按钮与\"讲讲XX的故事/传说\"类问法；每处遗产点收录一个最出名、最有画面感的故事。\n> 诚信标注（重要）：每条标题注明【史实】或【民间传说】；传说条目是口传文学，**不得当作史实引用**；史实条目标注权威来源。\n> 分段说明：每条以 `## ` 标题分隔，确保知识库按故事条目分段。\n\n---"},{"file":"21_景点故事分册.md","title":"故事·钟鼓楼：暮鼓晨钟，全城听着它作息【史实】","text":"明清的北京没有手表，全城人听钟鼓楼过日子：黄昏击鼓，叫\"定更\"，城门缓缓关闭、各家上灯；清晨鸣钟，城门开启、商贩上街——这就是\"暮鼓晨钟\"。鼓楼里曾有更鼓二十五面，1900年庚子之变中遭侵略者砍劈损毁，今天仅存的主鼓鼓面上仍留有当年的刀痕，是那段历史的实物见证。站在鼓楼上俯瞰中轴线北端，想象八百年间每天两次、声震全城的报时声，就能理解\"时间在这里是被敲出来的\"。(来源：北京市文物局、北京日报)"},{"file":"21_景点故事分册.md","title":"故事·万宁桥：元代漕船就是从这儿开进大都的【史实】","text":"元代时，江南的漕船沿通惠河一路北上，穿过万宁桥下的澄清上闸，直抵积水潭码头——今天的什刹海当年是千帆云集的\"国家级物流枢纽\"，万宁桥正是漕运进入大都城的第一道门户，可谓\"一桥担起南北漕运\"。桥是\"桥闸一体\"：桥下之闸升起放船、落下蓄水，控制着整条通惠河的水位。由于常年过船，桥栏和岸上的镇水兽被磨得温润发亮。【民间传说】桥边的镇水兽叫\"趴蝮\"，是龙生九子之一，性喜水，古人放在桥边镇水护桥，老北京还有\"摸摸趴蝮不淹水\"的说法——不过它是珍贵文物，看看就好，请勿触摸。(来源：北京市文物局；传说为民间口传)"},{"file":"21_景点故事分册.md","title":"故事·景山：一棵老槐树与一个王朝的落幕【史实】","text":"1644年3月19日清晨，李自成大军攻破北京城。崇祯皇帝在殿前鸣钟召集百官，无一人前来。他带着身边仅剩的太监王承恩登上景山（当时称万岁山），在一棵老槐树下自缢殉国，大明王朝276年统治就此落幕。清代为收拢人心，将这棵树封为\"罪槐\"，并规定百官路过需下马。原树已毁于历史变迁，今天看到的是后来补栽的，树旁立有\"明思宗殉国处\"碑。现在这里是大爷大妈打拳遛鸟的公园——站在山巅万春亭上南望故宫金顶，很难不感慨历史的风云变换。(来源：《明史》记载，参见北京日报文史版)"},{"file":"21_景点故事分册.md","title":"故事·故宫角楼：蝈蝈笼子里飞出的建筑奇迹【民间传说】","text":"相传当年皇帝下令在城墙四角建角楼，要求做成\"九梁十八柱七十二条脊\"，工匠们画了多少图样都搭不出来，急得团团转。有位老木匠上街散心，看见一个蝈蝈笼子编得精巧别致，买了回去。拆开细看，笼子的梁、柱、脊层层咬合，不多不少正好\"九梁十八柱七十二条脊\"——传说这卖笼子的老人就是鲁班，特来点化工匠。传说自然当不得真，但角楼的结构之精巧是真的：三重檐、多角交错、榫卯咬合无一钉一铆，是故宫造型最复杂的建筑，也是今天摄影师蹲守日落的最美机位。(性质：民间传说，形制说明见故宫博物院官网)"},{"file":"21_景点故事分册.md","title":"故事·端门与午门：\"推出午门斩首\"其实是以讹传讹【史实】","text":"\"把你推出午门斩首！\"——影视剧里常这么喊，但翻遍明清史料，午门外从未斩过大臣。真实的午门是举行大典的礼仪之门：打了胜仗，将士在午门献俘，皇帝亲登城楼受俘；每年十月初一，皇帝在午门颁发第二年的历书，叫\"颁朔\"。至于\"推出午门斩首\"的说法，很可能是把明代皇帝在午门\"廷杖\"惩罚大臣（有人被打死）以讹传讹了。而端门在午门之南，是皇帝出入午门前后仪仗整队、存放仪仗的\"礼仪缓冲区\"——两道门一字排开，衬托的就是皇权的威仪。站在端门与午门之间，头顶是高耸城台，脚下是六百年前的御道。(来源：故宫博物院官网)"},{"file":"21_景点故事分册.md","title":"故事·天安门：华表上的石犼，一只盼他出门，一只盼他回家【民间传说】","text":"天安门前后的汉白玉华表顶上，各蹲着一只神兽\"犼\"，民间给它们起了有意思的名字：面向宫外那对叫\"望君归\"——皇帝出巡太久流连山水，就盼着皇上赶紧回宫理政；面向宫内那对叫\"望君出\"——皇帝深居九重不出门，就盼着皇上出来体察民情。传说寄托的是老百姓朴素的期望：皇帝既要出门看世界，也要回家干正事。【史实】1949年10月1日，开国大典在天安门举行，54门礼炮齐鸣28响，毛泽东主席在这里宣告中华人民共和国中央人民政府成立——这座城门从此成为国家的象征。(传说为民俗口传；史实见新华网开国大典史料)"},{"file":"21_景点故事分册.md","title":"故事·外金水桥：在皇帝的\"特供河\"里洗个手都可能获罪【史实】","text":"金水河的名字自带贵气——在元代，它是皇家专属河道，朝廷明令禁止在河中洗手、濯衣甚至饮马，在\"金水\"里洗个手都可能获罪，堪称皇帝的\"特供水\"。到了明代，天安门前跨金水河建起七座石桥：正对五个门洞的主桥五座，居中的御路桥旧时只有皇帝一人能走，两侧王公桥、品级桥按身份分用——一座桥面就是一套等级制度。今天任何人都可以随意走过每一座桥，从桥上望天安门拍照，是中轴线上最受欢迎的机位之一。六百年间，\"谁能过桥\"的规则天翻地覆，桥还是那座桥。(来源：北京市文物局；《元史·河渠志》载金水河禁令)"},{"file":"21_景点故事分册.md","title":"故事·天安门广场：一块百吨巨石，从青岛\"漂\"到北京【史实】","text":"人民英雄纪念碑的碑心石，是一整块百吨级的巨型花岗岩。1953年，石料从青岛浮山采出后，怎么运到北京成了大难题：先在山脚下用滚木一点点挪下山，再靠铁道桥加固、巨型吊装，最后经海运抵京——当年动员了七千多名工人，历时数月，被称为\"二次长征\"。1949年9月30日，开国大典前一天，毛泽东率全体政协代表在广场执锹奠基，亲手培下第一锹土。今天你看到的\"三年以来……三十年以来……由此上溯到一千八百四十年\"三段碑文，就刻在这块巨石正面。(来源：新华网、人民网纪念碑史料)"},{"file":"21_景点故事分册.md","title":"故事·太庙：整根金丝楠木立起来的皇家祖庙【史实】","text":"太庙前殿的大柱是整根的金丝楠木，不加拼接——这种生长千年的名贵木料，纹理在灯下泛着金丝，明清时专供皇家，民间\"僭越\"使用是重罪。太庙是皇帝祭祖之地，\"左祖右社\"里的\"左祖\"就是它。【民间传说】太庙里还有相传明成祖朱棣亲手栽下的\"神柏\"，说移栽时以此树能否成活占卜国运——树活了，所以有了两百多年的明朝江山。传说不必当真，但太庙古柏森森、树龄数百年是实景，如今在劳动人民文化宫的树荫下散步，就是在当年皇帝祭祖的甬道上。(来源：北京市劳动人民文化宫（太庙）官方介绍；传说为民俗口传)"},{"file":"21_景点故事分册.md","title":"故事·社稷坛：五色土，一坛子\"江山\"【史实】","text":"社稷坛上铺着五种颜色的土：东青、南红、西白、北黑、中黄，对应五方五色。这些土不是随便挖的——明清时由全国各地纳贡而来，象征着\"普天之下莫非王土\"：五方之土汇于一坛，皇帝在坛前祭祀土神与谷神，祈的是江山永固、风调雨顺。\"社稷\"二字从此成为\"国家\"的代名词——所谓\"江山社稷\"，源头就在这座不到一亩的小坛。今天中山公园内的社稷坛五色土保存完好，是明朝永乐年间延续至今的原坛原制，站在坛边看五色土，看的其实是一整套古代政治哲学。(来源：北京市文物局、中山公园)"},{"file":"21_景点故事分册.md","title":"故事·南段御道：挖开三层马路，底下是七百年前的皇帝走的路【史实】","text":"2022年，考古工作者在正阳门至永定门之间的地下开始发掘：先揭开现代沥青马路，再往下是晚清民国铺电车道时垫的土层，一层层\"剥洋葱\"之后，明代居中御道的石板出现了——它不偏不倚正压在中轴线的位置上。连同2004年的发掘，三处遗址实证了这条线从明代起就没有挪过窝，为\"7.8公里全线历史真实性\"补上了关键拼图。一条埋在地下几百年的路，靠着考古工作者的小铲子重见天日——这是中轴线上最新鲜的\"考古现场\"故事。(来源：北京市文物局、新华网)"},{"file":"21_景点故事分册.md","title":"故事·天坛：祈年殿烧毁过一次，回音壁会\"传话\"【史实】","text":"今天看到的祈年殿其实不是明代原件：清光绪十五年（1889年），一道雷火把这座大殿烧成了灰烬，光绪帝下令依原样重建——不设大梁长檩、全靠28根柱子撑起三重檐的力学奇迹，得以原汁原味重现，所以它既是\"复刻版\"，也是建筑史上的孤例。另一边，回音壁的神奇人人可体验：两人隔着墙站立，贴着墙轻声说话，声音像沿着墙\"爬\"过来一样清晰——圆形磨砖对缝的墙体让声波沿壁连续反射，是古人无意间造出的声学装置。逛天坛，一个看\"重建的奇迹\"，一个玩\"会传话的墙\"。(来源：天坛公园管理处、北京市文物局)"},{"file":"21_景点故事分册.md","title":"故事·先农坛：皇帝也得下地干活，一年一天【史实】","text":"明清两代，每年开春，皇帝要亲自到先农坛的\"一亩三分地\"里扶犁耕地，行\"三推三返\"之礼——皇帝在前执犁，顺天府官员随后播种，礼毕登观耕台看大臣们继续耕完。这就是\"一亩三分地\"俗语的出处：天下都是皇帝的，但这一亩三分地必须他本人种。仪式的意义不在收成，而在向天下宣示\"重农\"——皇帝再尊贵，饭也得从土里来。如今在北京古代建筑博物馆（先农坛）里，还能看到当年的耤田与观耕台；每年这里还会举办复原的亲耕活动，孩子可以去体验\"皇帝的活儿\"有多累。(来源：北京市文物局、北京古代建筑博物馆)"},{"file":"21_景点故事分册.md","title":"故事·正阳门：北京城唯一存世的完整城门组群【史实】","text":"老北京有句民谚：\"前门楼子九丈九\"——用夸张的数字形容正阳门的高大。它确实是内城九门里规格最高的城门，城楼、箭楼、瓮城曾构成完整的防御组群。1900年庚子之变中，城楼与箭楼毁于战火，清政府此后依原制重建，是今天中轴线上唯一城楼与箭楼俱存的城门——站在前门大街北望，城楼箭楼一前一后，就是老北京城防的\"最后一道门面\"。民谚的九丈九是虚数，但当年进出京城的旅人，望见前门楼子就知道：北京到了。(来源：北京市文物局、正阳门管理处；民谚为民间口传)"},{"file":"21_景点故事分册.md","title":"故事·永定门：消失五十年后，它又\"长\"回来了【史实】","text":"永定门的命运堪称传奇：1553年建成，是外城正门、中轴线南端起点；1957年因交通改造被拆除——中轴线的最南端从此\"断了头\"。转折在2004年：依据史料记载与考古信息，永定门在原址按原有位置与形制复建，中轴线南端的完整景观得以重新\"闭合\"，为两年后启动的申遗之路补回了关键一环。一座城门见证了两件事：拆掉它只用了几个月，重建它等了半个世纪。今天傍晚到永定门公园，看夕阳从复建城楼后落下，\"南望永定门、北看钟鼓楼\"的7.8公里壮美秩序再次完整。(来源：北京市文物局)"},{"file":"22_教材关联分册.md","title":"22_教材关联分册.md","text":"> 用途：游客/学生问\"课本里学过中轴线吗\"\"这和我们课堂有什么关系\"时，给出**目录级核验过**的课文关联，一句话点到，不展开复述课文。\n> 来源与诚信声明：以下分册/课名逐条经电子课本目录核验（电子课本导航镜像 dzkbw.com，GBK 解码逐页核对，证据 URL 见各节\"来源\"；课名后括号注作者的，作者据公开出版信息，目录页原文未注作者）。课文正文、页码、配图以纸质教材为准，**本分册不复制课文原文**。不同年份版本目录结构或有调整，均以当年纸质教材为准。凡标注\"未核验/待纸质复核\"的一律不是确定引用，只是课堂联想或待复核项，引用时不得声称\"课本第X页写了\"。另有\"查无说明\"节，记录查过但现行目录没有的候选（不入库，防编造留痕）。"},{"file":"22_教材关联分册.md","title":"教材关联·总表","text":""},{"file":"22_教材关联分册.md","title":"教材关联·总表","text":"| 学科 | 分册 | 课 | 关联遗产点 |\n|---|---|---|---|\n| 音乐 | 一年级上册（旧版·现行2024秋版目录查无） | 第二单元欣赏《我爱北京天安门》 | 天安门 |\n| 音乐 | 一年级上册（旧版） | 第二单元唱歌《国旗国旗真美丽》 | 天安门广场（升旗联想） |\n| 音乐 | 一年级上册 | 第六单元\"小小歌唱家\"《中华人民共和国国歌》 | 天安门广场（升旗） |\n| 语文 | 一年级下册 | 第3课《我多想去看看》 | 天安门 |\n| 道法 | 一年级上册 | 第一单元第2课《我向国旗敬个礼》 | 天安门广场（升旗联想） |\n| 语文 | 三年级下册 | 第四单元第14课《赵州桥》 | 万宁桥（古桥营造对照） |\n| 语文 | 四年级上册 | 第六单元第17课《长城》 | 长城（教学迁移·非中轴线） |\n| 语文 | 四年级上册 | 第六单元第18课《颐和园》 | 颐和园（拓展对照·非中轴线） |\n| 语文 | 五年级上册 | 第四单元第13课《圆明园的毁灭》 | 圆明园（拓展对照·非中轴线） |\n| 语文 | 六年级上册 | 第6课《开国大典》 | 天安门、天安门广场 |\n| 语文 | 六年级下册 | 第一单元第1课《北京的春节》（老舍） | 北京旧城（春节民俗） |\n| 美术 | 五年级上册 | 第7课《古朴精美的华表》 | 故宫、天安门（华表对照） |\n| 美术 | 六年级下册（疑为旧版·实例待纸质核对） | 第15课《我国古代建筑艺术》 | 古建筑群（课内实例待核对） |\n| 语文 | 七年级上册 | 第一单元第1课《春》 | 写景方法迁移（见本分册末节） |\n| 语文 | 七年级上册 | 第一单元第2课《济南的冬天》（老舍） | 写景方法迁移（见本分册末节） |\n| 语文 | 八年级上册 | 第五单元第19课《中国石拱桥》 |"},{"file":"22_教材关联分册.md","title":"教材关联·总表","text":"万宁桥（古桥营造对照） |\n| 语文 | 八年级上册 | 第五单元第20课《苏州园林》 | 景山/御园（园林掇山理水对照） |\n| 语文 | 八年级上册 | 第五单元第21课《人民英雄永垂不朽》 | 天安门广场 |\n| 语文 | 八年级上册 | 第三单元写景方法迁移（方法联想非地点引用，见本分册末节） | 筒子河/角楼/景山（写景观察） |\n| 语文 | 九年级上册 | 第一单元第5课《你是人间的四月天》（林徽因） | 建筑学家视角（古建测绘保护） |\n| 历史 | 七年级下册 | 第三单元第15课《明朝的统治》 | 故宫 |\n| 历史 | 八年级上册 | 第六单元第17课《七七事变与全民族抗战》 | 卢沟桥（北京抗战记忆·拓展） |\n| 历史 | 八年级上册 | 第四单元第11课《五四运动》 | 天安门、天安门广场 |\n| 历史 | 八年级下册 | 第一单元第1课《中华人民共和国成立》 | 天安门、天安门广场 |\n| 地理 | 八年级下册 | 第七章北方地区第四节《祖国的首都——北京》 | 北京旧城整体（含中轴线） |\n| 数学 | 八年级上册 | 第十五章《轴对称》 | 中轴线对称格局（联想·非正文） |\n| 物理 | 八年级上册 | 第二章《声现象》 | 天坛回音壁（联想·非正文） |\n| 音乐 | 七年级上册 | \"印在心里的歌\"《中华人民共和国国歌》 | 天安门广场（升旗） |\n| 音乐 | 七年级上册（单篇曲目待纸质核对） | 第三单元学习项目三\"歌唱我们的祖国\" | 天安门（歌词关联·待核对） |\n| 语文 | 高中必修上册 | 第七单元第14课《故都的秋》（郁达夫） | 北京旧城（秋景） |\n| 语文 | 高中必修上册 | 第14课内略读《*荷塘月色》 | 北京（清华园拓展） |\n| 语文 | 高中必修上册 | 第七单元第15课《我与地坛（节选）》（史铁生）"},{"file":"22_教材关联分册.md","title":"教材关联·总表","text":"| 地坛（坛庙礼制对照·非中轴线） |\n| 历史 | 高中必修《中外历史纲要（上）》 | 第九单元第25课《中华人民共和国成立和向社会主义的过渡》 | 天安门 |\n| 历史 | 高中必修《中外历史纲要（上）》（关联待纸质核对） | 第四单元第12课《从明朝建立到清军入关》 | 紫禁城/中轴线格局（待核对） |\n| 美术 | 高中必修《美术鉴赏》（实例待纸质核对） | 第二单元第7课《华夏意匠—中国传统建筑与园林艺术》 | 故宫/古建筑群（实例待核对） |"},{"file":"22_教材关联分册.md","title":"音乐·一年级上册《我爱北京天安门》（旧版）","text":"旧版一年级上册音乐第二单元《我爱家乡 我爱祖国》欣赏曲目《我爱北京天安门》，关联天安门。课堂衔接：唱到\"金光闪闪的红灯\"时，可对照天安门城楼照片认一认城楼与华表。**版本说明**：现行2024秋版一年级上册音乐目录（项目制，已无欣赏单篇）查无此歌，此条仅对旧版年份成立，引用时须说明版本。(来源：旧版一年级上册音乐教材目录 http://www.dzkbw.com/books/rjb/yinyue/jp1s/ ；现行版 http://www.dzkbw.com/books/rjb/yinyue/jp1s_2024/ 查无)"},{"file":"22_教材关联分册.md","title":"音乐·一年级上册旧版《国旗国旗真美丽》","text":"旧版一年级上册音乐第二单元唱歌《国旗国旗真美丽》，与升旗联想相关，关联天安门广场。课堂衔接：看升旗前唱一唱，再到广场看真正的升旗。(来源：旧版一年级上册音乐教材目录；现行2024秋版查无，以旧版年份为准)"},{"file":"22_教材关联分册.md","title":"音乐·一年级上册《中华人民共和国国歌》","text":"一年级上册音乐第六单元\"小小歌唱家\"《中华人民共和国国歌》，关联天安门广场升旗。课堂衔接：广场升旗时奏唱的就是这首，课上学过再到现场听一次。(来源：一年级上册音乐教材目录 http://www.dzkbw.com/books/rjb/yinyue/jp1s_2024/ )"},{"file":"22_教材关联分册.md","title":"语文·一年级下册《我多想去看看》","text":"一年级下册语文第3课《我多想去看看》，小主人公想到天安门看升旗。课堂衔接：来天安门广场看升旗之前/之后重读这篇课文，感受从\"想去看看\"到\"亲眼看到\"。(来源：一年级下册语文教材目录)"},{"file":"22_教材关联分册.md","title":"道法·一年级上册《我向国旗敬个礼》","text":"一年级上册《道德与法治》第一单元第2课《我向国旗敬个礼》，升旗礼仪启蒙，关联天安门广场升旗。课堂衔接：课上学敬礼礼仪，到广场看升旗时用上。(来源：一年级上册道法教材目录 http://www.dzkbw.com/books/rjb/zhengzhi/1s_2024/ )"},{"file":"22_教材关联分册.md","title":"语文·三年级下册《赵州桥》","text":"三年级下册语文第四单元第14课《赵州桥》，讲古桥营造，关联万宁桥对照。课堂衔接：用课上学的\"古桥为什么坚固\"对照看万宁桥的石拱与镇水兽。(来源：三年级下册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/xs3x_2026/ )"},{"file":"22_教材关联分册.md","title":"语文·四年级上册《长城》（教学迁移·非中轴线）","text":"四年级上册语文第六单元第17课《长城》，课文写的不是中轴线。课堂衔接（教学迁移）：长城与北京中轴线都是中华文明标识，学完这课可对比\"长城之长\"与\"中轴之正\"，理解不同类型的世界遗产。(来源：四年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/xs4s_2026/ )"},{"file":"22_教材关联分册.md","title":"语文·四年级上册《颐和园》（拓展对照·非中轴线）","text":"四年级上册语文第六单元第18课《颐和园》，课文写的不是中轴线。课堂衔接（拓展对照）：颐和园是皇家园林代表，与中轴线上的景山御园可对照看\"皇家园林的山水格局\"。(来源：四年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/xs4s_2026/ )"},{"file":"22_教材关联分册.md","title":"语文·五年级上册《圆明园的毁灭》（拓展对照·非中轴线）","text":"五年级上册语文第四单元第13课《圆明园的毁灭》，课文写的不是中轴线。课堂衔接（拓展对照）：圆明园之毁与北京旧城格局变迁同属近现代史记忆，可与中轴线申遗保护对照理解\"为什么要保护\"。 (来源：五年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/xs5s_2026/ )"},{"file":"22_教材关联分册.md","title":"语文·六年级上册《开国大典》","text":"六年级上册语文第6课《开国大典》，讲述1949年10月1日在天安门广场举行的开国大典，关联天安门城楼与广场。课堂衔接：站在广场上读这篇课文，对照城楼、观礼台的位置想象当年场景。(来源：六年级上册语文教材目录；史实口径以本库时间线为准)"},{"file":"22_教材关联分册.md","title":"语文·六年级下册《北京的春节》（老舍）","text":"六年级下册语文第一单元第1课《北京的春节》（老舍），讲老北京春节民俗，关联北京旧城。课堂衔接：正阳门、前门大街的庙会年味就是课文里的\"京味儿\"，春节前后可对照着逛。(来源：六年级下册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/xs6x_2019/ )"},{"file":"22_教材关联分册.md","title":"美术·五年级上册《古朴精美的华表》","text":"五年级上册美术第7课《古朴精美的华表》（前为第6课《地球的新生》，后为第8课《鸟语花香》）。课堂衔接：学完这课可到太和殿前、天安门前对照实物看华表柱身的石雕纹样。课文内页讲解词以纸质教材为准。(来源：五年级上册美术教材目录)"},{"file":"22_教材关联分册.md","title":"美术·六年级下册《我国古代建筑艺术》（疑旧版·实例待核对）","text":"六年级下册美术第15课《我国古代建筑艺术》，讲中国古代建筑。课堂衔接：课上学的殿宇、城门知识可到故宫、正阳门对照实物。**版本与实例说明**：该下册目录页未标年份（疑为旧版，现行2026秋版六年级上册目录查无此课）；目录未注课内实例是否为故宫/天安门，实例关联待纸质教材复核，引用时不得声称课本写了故宫。(来源：六年级下册美术教材目录 http://www.dzkbw.com/books/rjb/meishu/6x ；上册对照 http://www.dzkbw.com/books/rjb/meishu/6s_2026/ 查无)"},{"file":"22_教材关联分册.md","title":"语文·七年级上册《春》（写景方法迁移）","text":"七年级上册语文第一单元第1课《春》，课文写的不是中轴线。课堂衔接（方法迁移）：用课上学的\"抓住景物特征、多角度描绘\"的方法观察中轴线春景（如太庙银杏、景山春望）。(来源：七年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/7s_2024/ )"},{"file":"22_教材关联分册.md","title":"语文·七年级上册《济南的冬天》（老舍·写景方法迁移）","text":"七年级上册语文第一单元第2课《济南的冬天》（老舍），课文写的不是中轴线。课堂衔接（方法迁移）：老舍也写北京，学这课\"温晴\"笔法时，可 winter 对照看中轴线冬景的层次（角楼雪景、筒子河冰面）。(来源：七年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/7s_2024/ )"},{"file":"22_教材关联分册.md","title":"语文·八年级上册《中国石拱桥》","text":"八年级上册语文第五单元第19课《中国石拱桥》，说明文单元（抓住特征），关联万宁桥对照。课堂衔接：用课上学的\"说明事物抓特征\"方法，现场观察万宁桥单孔石拱与镇水兽。(来源：八年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/8s_2025/ )"},{"file":"22_教材关联分册.md","title":"语文·八年级上册《苏州园林》","text":"八年级上册语文第五单元第20课《苏州园林》，说明文单元，关联景山/御园对照。课堂衔接：苏州园林讲掇山理水，景山就是一座\"人造山园\"，可对照理解\"虽由人作，宛自天开\"。 (来源：八年级上册语文教材目录 http://www.dzkbw.com/books/rjb/yuwen/8s_2025/ )"},{"file":"22_教材关联分册.md","title":"语文·八年级上册《人民英雄永垂不朽》","text":"八年级上册语文第五单元第21课《人民英雄永垂不朽——瞻仰首都人民英雄纪念碑》，说明文单元（抓住特征），关联天安门广场人民英雄纪念碑。课堂衔接：用课上学的\"说明事物抓特征\"方法，现场观察纪念碑碑文与浮雕。现行2025秋版目录；不同年份版本目录结构或有调整，以当年纸质教材为准。(来源：八年级上册语文教材目录)"},{"file":"22_教材关联分册.md","title":"历史·七年级下册《明朝的统治》","text":"七年级下册历史第三单元第15课《明朝的统治》，讲明成祖永乐年间营建北京、兴建宫殿，紫禁城落成，中轴线格局成形。课堂衔接：与本库时间线\"1406年下诏营建、1420年基本建成\"对照记忆。不同年份版本课序或有调整，以当年纸质教材为准。(来源：七年级下册历史教材目录；年代口径以本库为准)"},{"file":"22_教材关联分册.md","title":"历史·八年级上册《七七事变与全民族抗战》（卢沟桥拓展）","text":"八年级上册历史第六单元第17课《七七事变与全民族抗战》，1937年卢沟桥事变。课堂衔接（拓展）：卢沟桥不在中轴线上，但同属北京抗战记忆，走完中轴线可延伸理解\"北京作为古都与现代首都的双重历史\"。(来源：八年级上册历史教材目录 http://www.dzkbw.com/books/rjb/lishi/8s_2025/ )"},{"file":"22_教材关联分册.md","title":"历史·八年级上册《五四运动》","text":"八年级上册历史第四单元第11课《五四运动》，1919年5月4日，北京学生在天安门前集会游行。课堂衔接：站在天安门广场回想\"外争主权，内除国贼\"的口号，理解广场作为近现代史见证地的另一重身份。(来源：八年级上册历史教材目录)"},{"file":"22_教材关联分册.md","title":"历史·八年级下册《中华人民共和国成立》","text":"八年级下册历史第一单元第1课《中华人民共和国成立》，课内讲开国大典与天安门，关联天安门城楼与广场。课堂衔接：与语文六年级上册《开国大典》对照着学，一个管文学感受、一个管历史因果。(来源：八年级下册历史教材目录 http://www.dzkbw.com/books/rjb/lishi/8x_2026/ )"},{"file":"22_教材关联分册.md","title":"地理·八年级下册《祖国的首都——北京》","text":"八年级下册地理第七章\"北方地区\"第四节《祖国的首都——北京》，讲首都职能与城市格局，关联北京旧城整体（含中轴线）。课堂衔接：课上学的\"北京旧城格局\"到中轴线实地一看就懂，注意旧教材疑为\"第六章\"，现行已前移为第七章。(来源：八年级下册地理教材目录 http://www.dzkbw.com/books/rjb/dili/xc8x_2026/ )"},{"file":"22_教材关联分册.md","title":"数学·八年级上册《轴对称》（联想·非正文）","text":"八年级上册数学第十五章《轴对称》（15.1图形的轴对称/15.2画轴对称的图形/15.3等腰三角形）：章名经目录核验；正文是否以中轴线为实例**未核验**。此处仅为课堂联想——学轴对称时可把中轴线左右对称格局当实例观察。**纠错**：旧版分册误作\"第十三章\"，现按目录更正为第十五章。(来源：八年级上册数学教材目录 http://www.dzkbw.com/books/rjb/shuxue/xc8s_2025/ )"},{"file":"22_教材关联分册.md","title":"物理·八年级上册《声现象》（联想·非正文）","text":"八年级上册物理第二章《声现象》：章名经目录核验；正文是否以回音壁为实例**未核验**。此处仅为课堂联想——学声现象时可联想天坛回音壁的声学现象。(来源：八年级上册物理教材目录 http://www.dzkbw.com/books/rjb/wuli/xc8s_2024/ )"},{"file":"22_教材关联分册.md","title":"音乐·七年级上册《中华人民共和国国歌》","text":"七年级上册音乐\"印在心里的歌\"《中华人民共和国国歌》，关联天安门广场升旗。课堂衔接：广场升旗奏唱的就是课上唱过的这首。(来源：七年级上册音乐教材目录 http://www.dzkbw.com/books/rjb/yinyue/7s_2024/ )"},{"file":"22_教材关联分册.md","title":"音乐·七年级上册\"歌唱我们的祖国\"（单篇曲目待核对）","text":"七年级上册音乐第三单元学习项目三\"歌唱我们的祖国\"，歌词关联天安门。课堂衔接：唱到\"五星红旗迎风飘扬\"可对照天安门城楼。**说明**：目录原文为学习项目（非单篇《歌唱祖国》），单篇曲目是否为正文待纸质核对，引用时不得声称课本刊载该歌。(来源：七年级上册音乐教材目录 http://www.dzkbw.com/books/rjb/yinyue/7s_2024/ )"},{"file":"22_教材关联分册.md","title":"美术·九年级上册《故宫六百年》","text":"九年级上册美术第四单元《共生共享——世界遗产掠影》第2课《故宫六百年》，关联故宫。课堂衔接：用课上学到的斗拱、屋顶、色彩知识，现场数一数太和殿的屋顶层数、认一认檐下彩画。2026秋版目录；不同年份版本或有调整，以当年纸质教材为准。(来源：九年级上册美术教材目录)"},{"file":"22_教材关联分册.md","title":"语文·高中必修上册《故都的秋》（郁达夫）","text":"高中语文必修上册第七单元第14课《故都的秋》（郁达夫），写北平秋味，关联北京旧城。课堂衔接：秋天走中轴线（景山、太庙银杏）时重读\"秋槐落蕊而知秋\"，把课文里的秋接到眼前。(来源：高中语文必修上册教材目录 http://www.dzkbw.com/books/rjb/yuwen/gzbxgysc/ )"},{"file":"22_教材关联分册.md","title":"语文·高中必修上册《*荷塘月色》（略读·北京拓展）","text":"高中语文必修上册第14课内略读《*荷塘月色》，关联北京（清华园）。课堂衔接（拓展）：同属北平记忆，与《故都的秋》对照读，一个写秋味、一个写月夜。(来源：高中语文必修上册教材目录 http://www.dzkbw.com/books/rjb/yuwen/gzbxgysc/ )"},{"file":"22_教材关联分册.md","title":"语文·高中必修上册《我与地坛（节选）》（史铁生·坛庙对照）","text":"高中语文必修上册第七单元第15课《我与地坛（节选）》（史铁生），写地坛。课堂衔接（礼制对照）：地坛不在中轴线上，但与中轴线上的天坛、先农坛同属明清坛庙礼制建筑，\"左祖右社、天坛地坛\"的格局可对照理解。(来源：高中语文必修上册教材目录 http://www.dzkbw.com/books/rjb/yuwen/gzbxgysc/ )"},{"file":"22_教材关联分册.md","title":"历史·高中纲要（上）《中华人民共和国成立和向社会主义的过渡》","text":"高中必修《中外历史纲要（上）》第九单元第25课《中华人民共和国成立和向社会主义的过渡》，课内讲开国大典与天安门。课堂衔接：与初中《中华人民共和国成立》、语文《开国大典》三课对照，从初中史实升到高中\"社会主义过渡\"的因果。(来源：高中历史纲要（上）教材目录 http://www.dzkbw.com/books/rjb/lishi/zwlsgys/ )"},{"file":"22_教材关联分册.md","title":"历史·高中纲要（上）《从明朝建立到清军入关》（关联待纸质核对）","text":"高中必修《中外历史纲要（上）》第四单元第12课《从明朝建立到清军入关》：课名与位置经目录核验；目录未出现\"营建北京/紫禁城\"字样，课内是否讲永乐营建**待纸质核对**。此处为待复核项，引用时只能说\"该课可能涉及明初营建，待纸质教材核对\"，不得声称课本写了紫禁城。(来源：高中历史纲要（上）教材目录 http://www.dzkbw.com/books/rjb/lishi/zwlsgys/ )"},{"file":"22_教材关联分册.md","title":"美术·高中必修《美术鉴赏》《华夏意匠》（实例待纸质核对）","text":"高中必修《美术鉴赏》第二单元第7课《华夏意匠—中国传统建筑与园林艺术》：课名与位置经目录核验；课内实例是否为故宫**待纸质核对**。课堂衔接：课上学的中国传统建筑知识可到故宫对照斗拱屋顶；引用时不得声称课本写了故宫。(来源：高中美术鉴赏教材目录 http://www.dzkbw.com/books/rjb/meishu/pgzbx_msjs/ )"},{"file":"22_教材关联分册.md","title":"语文·八年级上册第三单元写景方法迁移（方法联想·非地点引用）","text":"八年级上册语文第三单元是山水写景单元（《三峡》《答谢中书书》《记承天寺夜游》《与朱元思书》，篇目经纸质教材实拍核对），课文写的不是中轴线，此处**不是教材引用**，只是写景方法迁移建议：用课上学的\"抓住景物特征、分季节时段观察\"的方法看中轴线——如仿《三峡》分时段看筒子河与角楼（晨/暮/四季之景各不同），仿《答谢中书书》对照景山俯瞰中轴线的层次，仿《与朱元思书》体会古建群落的向心格局。回答与引用时只能说\"可以用课上学的写景方法观察\"，不得声称课本写了中轴线。(来源：八年级上册语文纸质教材实拍核对篇目；观察对象口径以本库为准)"},{"file":"22_教材关联分册.md","title":"数学·八年级上册《轴对称》→中轴线对称格局·课堂观察任务（联想·非正文）","text":"八年级上册数学第十五章《轴对称》（15.1图形的轴对称/15.2画轴对称的图形/15.3等腰三角形）：章名经目录核验；正文是否以中轴线为实例**未核验**。此处不是教材引用，而是把课上知识带到实地用的课堂观察任务——**中轴线就是北京旧城的一条对称轴**：太庙（东）与社稷坛（西）分列左右、天坛（东）与先农坛（西）南北呼应。现场三步任务：①站在景山万春亭南望，指出左右对称的一组建筑；②用\"对称轴\"说出中轴线在旧城格局里的作用；③找一组对称构图拍下来（以建筑为主体）。回答与引用时只能说\"用课上学的轴对称知识观察中轴线\"，不得声称课本写了中轴线；以当年纸质教材为准。(来源：八年级上册数学教材目录 http://www.dzkbw.com/books/rjb/shuxue/xc8s_2025/ ；格局口径以本库00_总览为准)"},{"file":"22_教材关联分册.md","title":"物理·八年级上册《声现象》→天坛回音壁·课堂观察任务（联想·非正文）","text":"八年级上册物理第二章《声现象》：章名经目录核验；正文是否以回音壁为实例**未核验**。此处不是教材引用，而是把课上知识带到实地用的课堂观察任务——天坛回音壁是现成的\"声音现场\"：两人隔墙站立、贴墙轻声说话，声音沿圆形墙体连续反射传到另一端。现场两步任务：①亲测一次\"贴墙传话\"，说出声音是怎么过来的；②对照课上学的声音传播知识，解释为什么必须是圆形磨砖对缝的墙。回答与引用时只能说\"用课上学的声现象知识做观察\"，不得声称课本写了回音壁；以当年纸质教材为准。(来源：八年级上册物理教材目录 http://www.dzkbw.com/books/rjb/wuli/xc8s_2024/ ；回音壁口径以本库13_天坛分册为准)"},{"file":"22_教材关联分册.md","title":"查无说明（查过但不入库·防编造留痕）","text":"以下候选逐页核对目录后确认现行版没有，一律不入库，记录在此防止日后误编：① 语文《故宫博物院》——现行2025秋版八年级上册第五单元（19中国石拱桥/20苏州园林/21人民英雄永垂不朽/22梦回繁华）查无，旧版对照页亦无，按\"已删除疑\"处理；② 语文《北京》（\"天安门在北京城的中央\"）——现行二年级上/下册完整目录均无，按旧版已删除处理；③ 国徽专项——小学1–6年级上下册加中学7–9年级全部道法目录\"国徽\"零命中，不入库；④ 七/八年级美术故宫课——七上（城市名片/标志设计等）、八上（中国园林/山水画）目录均无\"故宫/古建筑\"课，不入库；⑤ 初中英语北京专文——七至九年级各册目录均为通用Unit标题，无北京/天安门专文，不入库；⑥ 高中《林黛玉进贾府》——必修下册第七单元为整本书阅读《红楼梦》，无此单篇，不入库（红楼梦可作拓展阅读建议，非教材引用）；⑦ 小学数学《图形的运动》——现行二/三/四上新版目录已无该章名（改按\"例\"编排），小学侧不入库，只保留中学八上《轴对称》。"}],"faqs":["Q1 北京中轴线有多长?包括哪15处?\n全长7.8公里，北起钟鼓楼、南至永定门，15处遗产构成要素为：钟鼓楼、万宁桥、景山、故宫、端门、天安门、外金水桥、天安门广场及建筑群、太庙、社稷坛、中轴线南段道路遗存、天坛、先农坛、正阳门、永定门。(来源：北京市文物局)","Q2 中轴线是什么时候申遗成功的?\n2024年7月27日，在印度新德里举行的联合国教科文组织第46届世界遗产大会上，\"北京中轴线——中国理想都城秩序的杰作\"列入《世界遗产名录》，成为中国第59项世界遗产。申遗工作2012年列入预备名单，历时12年。(来源：新华网)","Q3 中轴线上最古老的建筑是哪座?\n万宁桥。元代始建(1285年前后)，单孔石拱桥，跨玉河水系，桥岸现存镇水兽六尊(元代原物仅桥东北一尊，余为明清补配)，至今仍在通行使用，是中轴线上最古老的\"活态遗产\"。(来源：北京市文物局)","Q4 景山为什么被称为最佳观景点?\n景山是中轴线制高点，万春亭登临可南望故宫金色屋顶全景、北望钟鼓楼，一条壮美秩序尽收眼底。建议日落前一小时登顶，顺光看故宫最佳。(来源：北京市文物局)","Q5 太和殿的脊兽为什么是10只?\n按古建等级，脊兽一般3、5、7、9只奇数递减，太和殿破例用满10只（行什为第10只，仅此一例），是全国孤例，代表最高等级；故宫中等级仅次于太和殿的保和殿为9只（排列到斗牛为止，没有行什）。注意计数口径：檐角最前端的\"骑凤仙人\"不算走兽，走兽从龙开始数，共10只：龙、凤、狮子、天马、海马、狻猊、狎鱼、獬豸、斗牛、行什。(来源：故宫博物院官网\"走兽\"词条 dpm.org.cn)","Q6 故宫怎么预约?周几闭馆?\n周一闭馆(法定节假日除外)，须在\"故宫博物院\"官方渠道实名提前预约，旺季票务紧张。以官方最新公告为准。(来源：故宫博物院官网)","Q7 天安门广场怎么进?\n进入广场需提前通过官方小程序预约；清晨看升旗仪式需更早排队安检。以官方最新公告为准。(来源：天安门地区管理委员会)","Q8 \"左祖右社\"是什么意思?\n出自《周礼·考工记》都城营建制度：宫殿前方左侧(东)建太庙祭祖、右侧(西)建社稷坛祭土谷之神。北京中轴线上太庙在东、社稷坛在西，正是这一理想的实物体现。(来源：北京市文物局)","Q9 社稷坛的五色土有什么讲究?\n坛上铺五色土：东青、南红、西白、北黑、中黄，对应五方五色，象征\"普天之下莫非王土\"。社稷坛在今中山公园内。(来源：北京市文物局)","Q10 \"一亩三分地\"这个俗语从哪来?\n源自先农坛的耤田礼：明清皇帝每年春在此祭祀先农神并亲扶犁耕种的一块田，面积恰为一亩三分，俗语由此流传。今先农坛设北京古代建筑博物馆，镇馆之宝为隆福寺藻井。(来源：北京市文物局)","Q11 中轴线南段御道是怎么发现的?\n2004年和2022年考古发掘揭露三处遗址：珠市口南侧中轴道路排水沟渠遗址、珠市口南侧中轴道路路肩及板沟遗址、永定门北侧石板道遗存(位于永定门以北约100米处)。御道始建于明代，清末至民国因电车轨道铺设被掩埋。这些遗存实证了南段居中御道的走向与位置，为7.8公里全线的历史真实性提供了关键实物证据，2023年公布为北京市文物保护单位(批次信息以官方公告为准)。(来源：北京市文物局、新华网)","Q12 永定门是原建筑吗?\n始建于明嘉靖三十二年(1553年)，1957年拆除，2004年依据史料在原址复建。复建是中轴线整体保护的重要标志事件。(来源：北京市文物局)","Q13 天坛祈年殿有什么特别?\n始建于明永乐十八年(1420年)，三重檐攒尖顶不用大梁长檩，是中国古建筑力学杰作；回音壁、圜丘体现\"天圆地方\"观念。1998年列入《世界遗产名录》。(来源：北京市文物局)","Q14 钟鼓楼的\"暮鼓晨钟\"是什么制度?\n元明清三代的城市报时制度：黄昏击鼓定更、清晨鸣钟启城，全城作息由此调度，体现中轴线上的\"时间秩序\"。鼓楼内有击鼓表演场次，入场前查询当日安排。(来源：北京市文物局)","Q15 正阳门为什么叫\"前门\"?\n正阳门是内城正门，始建于明永乐年间，位于内城南墙正中、面朝前门大街，民间俗称\"前门\"。城楼与箭楼俱存，是中轴线上保存最完整的城门建筑组群。民谚\"前门楼子九丈九，四门三桥五牌楼\"即形容其气象。(来源：北京市文物局)","Q16 万宁桥的镇水兽是什么?\n趴蝮(bā xià)，传说中龙生九子之一，喜水，古人置于桥边水畔镇水护桥。万宁桥现存镇水兽六尊，其中经鉴定为元代原物的仅桥东北雁翅一尊（颌下刻\"至元四年九月\"题记），余五尊为明清补配，是\"桥闸一体\"水工设施的见证。请勿触摸攀爬。(来源：北京市文物局)","Q17 梁思成怎么评价北京中轴线?\n梁思成先生称北京中轴线是\"全世界最长、也最伟大的南北中轴线穿过全城\"，\"北京独有的壮美秩序就由这条中轴的建立而产生\"。(来源：梁思成《北京——都市计划的无比杰作》)","Q18 半天时间怎么游中轴线最合适?\n推荐精华线：永定门→先农坛→天坛→正阳门/前门→天安门广场→故宫→景山登顶俯瞰全轴。注意故宫需提前实名预约、周一闭馆。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)","Q19 一天时间怎么安排?\n推荐深度线：上午钟鼓楼→万宁桥→景山→故宫；下午端门/天安门→太庙或社稷坛→前门大街；傍晚天坛或先农坛。地铁8号线纵贯北段，2号线/7号线达前门，沿线多段可骑行。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)","Q20 带孩子游中轴线推荐哪条线?\n推荐北线：钟鼓楼(击鼓表演)→万宁桥找镇水兽→什刹海→景山登顶→故宫珍宝馆。节奏轻松、故事性强，适合亲子讲解。以官方最新公告为准。(来源：综合北京市文物局及各景区官方信息)","Q21 中轴线有什么保护法规?\n2022年5月25日北京市人大常委会通过《北京中轴线文化遗产保护条例》，同年10月1日起施行；申遗成功后，2025年5月30日又通过《北京中轴线世界文化遗产保护条例》，自公布之日起施行，原条例同时废止。回答时注意两部条例的时效区分。(来源：北京市人大常委会公开报道)","Q22 沿线怎么坐地铁?\n地铁8号线大致沿中轴线敷设：什刹海站(钟鼓楼、万宁桥)、南锣鼓巷/中国美术馆站(景山、故宫东侧)、前门站(正阳门、天安门广场南)、天桥站、永定门外站(南段御道遗存、先农坛)；1号线天安门东站(天安门、国博)、2号线可达鼓楼大街站与前门站。换乘与运营信息以官方最新公告为准。(来源：综合北京市文物局及公开交通信息)","Q23 景山公园几点开门?下午去来得及看日落吗?\n旺季(4月-10月)6:00开园、21:00闭园(20:30停止入园)，淡季(11月-3月)6:30开园、20:00闭园，万春亭随园开放；日落前一小时登顶看故宫效果最好。具体开放与售票安排以公园官方最新公告为准。(来源：北京市政务服务网公开信息)","Q24 故宫和景山之间那条河是什么?有多宽?\n那是筒子河(紫禁城护城河)，明永乐十八年(1420年)建成，河宽52米，条石垒砌驳岸，河水自西北流入、向东南流出至御河；过筒子河北望即景山，傍晚角楼与河面倒影相映，是经典摄影点。(来源：故宫博物院官网)","Q25 永定门最初是什么时候建的?\n永定门始建于明嘉靖三十二年(1553年)，是外城的正门、中轴线南端起点，寓意\"永远安定\"；1957年拆除，2004年依据史料与考古信息在原址复建，复建依据的是拆除前的老照片和历史测绘资料。(来源：北京市文物局)","Q26 内金水桥和外金水桥有什么区别?\n两者都是横跨金水河的汉白玉石桥，位置和规制不同：外金水桥在天安门前(外金水河上)，共七座——正对天安门五个门洞的主桥五座(居中御路桥旧时仅皇帝通行，两侧为王公桥、品级桥)，另有太庙、社稷坛前各一座；内金水桥在故宫太和门前(内金水河上)，共五座。两桥均建于明永乐年间。(来源：天安门地区管委会官网、新京报)","Q27 中轴线沿线去哪里吃饭?有什么京味小吃?\n沿线餐饮集中在几个片区：**前门大街·大栅栏·鲜鱼口**（正阳门旁，老字号最集中，北京烤鸭（正餐大菜，建议留足用餐时间）、爆肚、卤煮、炸酱面等京味小吃都能吃到）；**什刹海·后海**（毗邻万宁桥、钟鼓楼，有湖畔餐食与老字号）；**南锣鼓巷**（小吃街，毗邻景山、鼓楼，糖葫芦、驴打滚、艾窝窝、豌豆黄等北京小吃集中）；**牛街**（清真美食聚集，在中轴线西南侧，地铁可达；清真餐食有饮食禁忌，请尊重店家习俗；豆汁儿配焦圈的老吃法沿线也能找到）。用餐动线建议：北段（钟鼓楼、万宁桥）就近选什刹海一带，中段（故宫、天安门）选前门·大栅栏，南段（天坛、先农坛）可回前门或就近商圈。本条只写品类与片区、不点名具体店铺；各餐厅营业时间、排名与人均消费请以大众点评等点评平台及地图应用的实时信息为准。(来源：沿线餐饮片区为公开地理常识整理；具体店家信息以点评/地图平台实时数据为准)","Q28 课本里学过中轴线吗?有哪些课文相关?\n有，三十多篇人教版/统编版教材课文与中轴线地点相关（目录级核验，课文原文、页码与配图以纸质教材为准）。小学：音乐一年级上册旧版第二单元欣赏《我爱北京天安门》（天安门；现行2024秋版目录查无此歌，仅对旧版年份成立）、旧版唱歌《国旗国旗真美丽》、第六单元《中华人民共和国国歌》（天安门广场升旗）；语文一年级下册第3课《我多想去看看》（想到天安门看升旗）、三年级下册第14课《赵州桥》（古桥对照万宁桥）、四年级上册第17课《长城》第18课《颐和园》与五年级上册第13课《圆明园的毁灭》（教学拓展对照，非中轴线）、六年级上册第6课《开国大典》（天安门广场）、六年级下册第1课《北京的春节》（老舍，北京旧城民俗）；道法一年级上册第2课《我向国旗敬个礼》（升旗联想）；美术五年级上册第7课《古朴精美的华表》、美术六年级下册第15课《我国古代建筑艺术》（疑旧版，实例待核对）。初中：语文七年级上册第1课《春》第2课《济南的冬天》、八年级上册第三单元山水写景课文（《三峡》《与朱元思书》等，篇目经纸质教材实拍核对）可做写景方法迁移（用课上学的观察方法看筒子河、角楼与景山，不是地点引用）；八年级上册第19课《中国石拱桥》（对照万宁桥）、第20课《苏州园林》（对照景山园林）、第21课《人民英雄永垂不朽》（广场纪念碑）；九年级上册第5课《你是人间的四月天》（林徽因，古建测绘保护视角）；历史七年级下册第15课《明朝的统治》（永乐营建北京、紫禁城落成）、八年级上册第17课《七七事变与全民族抗战》（卢沟桥拓展）、第11课《五四运动》（1919年天安门前集会游行）、八年级下册第1课《中华人民共和国成立》（天安门）；地理八年级下册第七章第四节《祖国的首都——北京》（旧教材疑为第六章，现行已前移）；音乐七年级上册《中华人民共和国国歌》与第三单元\"歌唱我们的祖国\"项目（","Q28 课本里学过中轴线吗?有哪些课文相关?\n单篇曲目待纸质核对）；数学八年级上册第十五章《轴对称》、物理八年级上册第二章《声现象》仅为课堂联想（对称格局/回音壁），不是课文正文引用（旧版分册误作数学\"第十三章\"，现按目录更正）。高中：语文必修上册第14课《故都的秋》（郁达夫）、课内略读《*荷塘月色》、第15课《我与地坛（节选）》（史铁生，地坛坛庙礼制对照，非中轴线）；历史纲要（上）第25课《中华人民共和国成立和向社会主义的过渡》（天安门）、第12课《从明朝建立到清军入关》（紫禁城关联待纸质核对）；美术鉴赏第7课《华夏意匠》（实例待纸质核对）。其中数学八上《轴对称》、物理八上《声现象》两节已按\"课堂观察任务\"做细（对称格局三步观察/回音壁两步观察，见22_分册对应节），把课上知识带到实地用。查过但不入库的有：现行八上《故宫博物院》查无（已删除疑）、二年级《北京》已删除、国徽专项/初中美术故宫课/初中英语北京专文/高中《林黛玉进贾府》单篇/小学数学《图形的运动》现行目录均查无，详见《22_教材关联分册》\"查无说明\"。不同年份版本目录或有调整，以当年纸质教材为准；详细课堂衔接见《22_教材关联分册》。(来源：各册教材目录；史实口径以本库为准)"],"faq_titles":["Q1 北京中轴线有多长?包括哪15处?","Q2 中轴线是什么时候申遗成功的?","Q3 中轴线上最古老的建筑是哪座?","Q4 景山为什么被称为最佳观景点?","Q5 太和殿的脊兽为什么是10只?","Q6 故宫怎么预约?周几闭馆?","Q7 天安门广场怎么进?","Q8 \"左祖右社\"是什么意思?","Q9 社稷坛的五色土有什么讲究?","Q10 \"一亩三分地\"这个俗语从哪来?","Q11 中轴线南段御道是怎么发现的?","Q12 永定门是原建筑吗?","Q13 天坛祈年殿有什么特别?","Q14 钟鼓楼的\"暮鼓晨钟\"是什么制度?","Q15 正阳门为什么叫\"前门\"?","Q16 万宁桥的镇水兽是什么?","Q17 梁思成怎么评价北京中轴线?","Q18 半天时间怎么游中轴线最合适?","Q19 一天时间怎么安排?","Q20 带孩子游中轴线推荐哪条线?","Q21 中轴线有什么保护法规?","Q22 沿线怎么坐地铁?","Q23 景山公园几点开门?下午去来得及看日落吗?","Q24 故宫和景山之间那条河是什么?有多宽?","Q25 永定门最初是什么时候建的?","Q26 内金水桥和外金水桥有什么区别?","Q27 中轴线沿线去哪里吃饭?有什么京味小吃?","Q28 课本里学过中轴线吗?有哪些课文相关?","Q28 课本里学过中轴线吗?有哪些课文相关?"],"routes":[{"title":"路线A · 半日精华线(约4.5小时，步行+地铁)","md":"| 时间 | 地点 | 看点 | 交通 |\n|---|---|---|---|\n| 09:00–09:40 | 永定门 | 中轴线南端起点，御道遗存 | 地铁14号线永定门外站 |\n| 09:50–10:50 | 先农坛 | 一亩三分地、隆福寺藻井 | 步行约1.2km |\n| 11:00–12:00 | 天坛 | 三重檐攒尖顶、回音壁 | 西门入东门出 |\n| 12:10–13:00 | 正阳门/前门 | 城楼箭楼、午餐 | 步行约1km |\n| 13:10–13:40 | 天安门广场 | 纪念碑(需广场预约) | 前门站 |\n| 13:40–14:30 | 故宫 | 午门→三大殿→神武门(需预约) | 午门进 |\n| 14:30–15:30 | 景山万春亭 | 登顶俯瞰中轴线全景 | 神武门对面 |\n\n提示：故宫周一闭馆、需实名预约。"},{"title":"路线B · 一日深度线(约8小时)","md":"| 时间 | 地点 | 看点 | 交通 |\n|---|---|---|---|\n| 09:00–10:00 | 钟鼓楼 | 暮鼓晨钟、击鼓表演 | 地铁8号线什刹海站 |\n| 10:10–10:40 | 万宁桥 | 元代镇水兽、最古老石拱桥 | 步行约600m |\n| 10:50–11:50 | 景山 | 万春亭南望故宫全景 | 步行 |\n| 12:00–15:00 | 故宫 | 中轴三殿+珍宝馆(含午餐) | 需预约，周一闭馆 |\n| 15:20–16:20 | 太庙或社稷坛 | 左祖右社对称格局 | 步行 |\n| 16:30–17:30 | 天安门广场 | 纪念碑、国博外观 | 需广场预约 |\n| 17:30–19:30 | 前门+正阳门 | 晚餐、夜景 | 步行/地铁2号线 |\n| 19:30–20:30 | 天坛夜景或返程 | 祈年殿夜 ext":"1644年3月19日清晨，李自成大军攻破北京城。崇祯皇帝在殿前鸣钟召集百官，无一人前来。他带着身边仅剩的太监王承恩登上景山（当时称万岁山），在一棵老槐树下自缢殉国，大明王朝276年统治就此落幕。清代为收拢人心，将这棵树封为\"罪槐\"，并规定百官路过需下马。原树已毁于历史变迁，今天看到的是后来补栽的，树旁立有\"明思宗殉国处\"碑。现在这里是大爷大妈打拳遛鸟的公园——站在山巅万春亭上南望故宫金顶，很难不感慨历史的风云变换。(来源：《明史》记载，参见北京日报文史版)"},{"spot":"故宫角楼","title":"故事·故宫角楼：蝈蝈笼子里飞出的建筑奇迹【民间传说】","text":"相传当年皇帝下令在城墙四角建角楼，要求做成\"九梁十八柱七十二条脊\"，工匠们画了多少图样都搭不出来，急得团团转。有位老木匠上街散心，看见一个蝈蝈笼子编得精巧别致，买了回去。拆开细看，笼子的梁、柱、脊层层咬合，不多不少正好\"九梁十八柱七十二条脊\"——传说这卖笼子的老人就是鲁班，特来点化工匠。传说自然当不得真，但角楼的结构之精巧是真的：三重檐、多角交错、榫卯咬合无一钉一铆，是故宫造型最复杂的建筑，也是今天摄影师蹲守日落的最美机位。(性质：民间传说，形制说明见故宫博物院官网)"},{"spot":"端门与午门","title":"故事·端门与午门：\"推出午门斩首\"其实是以讹传讹【史实】","text":"\"把你推出午门斩首！\"——影视剧里常这么喊，但翻遍明清史料，午门外从未斩过大臣。真实的午门是举行大典的礼仪之门：打了胜仗，将士在午门献俘，皇帝亲登城楼受俘；每年十月初一，皇帝在午门颁发第二年的历书，叫\"颁朔\"。至于\"推出午门斩首\"的说法，很可能是把明代皇帝在午门\"廷杖\"惩罚大臣（有人被打死）以讹传讹了。而端门在午门之南，是皇帝出入午门前后仪仗整队、存放仪仗的\"礼仪缓冲区\"——两道门一字排开，衬托的就是皇权的威仪。站在端门与午门之间，头顶是高耸城台，脚下是六百年前的御道。(来源：故宫博物院官网)"},{"spot":"天安门","title":"故事·天安门：华表上的石犼，一只盼他出门，一只盼他回家【民间传说】","text":"天安门前后的汉白玉华表顶上，各蹲着一只神兽\"犼\"，民间给它们起了有意思的名字：面向宫外那对叫\"望君归\"——皇帝出巡太久流连山水，就盼着皇上赶紧回宫理政；面向宫内那对叫\"望君出\"——皇帝深居九重不出门，就盼着皇上出来体察民情。传说寄托的是老百姓朴素的期望：皇帝既要出门看世界，也要回家干正事。【史实】1949年10月1日，开国大典在天安门举行，54门礼炮齐鸣28响，毛泽东主席在这里宣告中华人民共和国中央人民政府成立——这座城门从此成为国家的象征。(传说为民俗口传；史实见新华网开国大典史料)"},{"spot":"外金水桥","title":"故事·外金水桥：在皇帝的\"特供河\"里洗个手都可能获罪【史实】","text":"金水河的名字自带贵气——在元代，它是皇家专属河道，朝廷明令禁止在河中洗手、濯衣甚至饮马，在\"金水\"里洗个手都可能获罪，堪称皇帝的\"特供水\"。到了明代，天安门前跨金水河建起七座石桥：正对五个门洞的主桥五座，居中的御路桥旧时只有皇帝一人能走，两侧王公桥、品级桥按身份分用——一座桥面就是一套等级制度。今天任何人都可以随意走过每一座桥，从桥上望天安门拍照，是中轴线上最受欢迎的机位之一。六百年间，\"谁能过桥\"的规则天翻地覆，桥还是那座桥。(来源：北京市文物局；《元史·河渠志》载金水河禁令)"},{"spot":"天安门广场","title":"故事·天安门广场：一块百吨巨石，从青岛\"漂\"到北京【史实】","text":"人民英雄纪念碑的碑心石，是一整块百吨级的巨型花岗岩。1953年，石料从青岛浮山采出后，怎么运到北京成了大难题：先在山脚下用滚木一点点挪下山，再靠铁道桥加固、巨型吊装，最后经海运抵京——当年动员了七千多名工人，历时数月，被称为\"二次长征\"。1949年9月30日，开国大典前一天，毛泽东率全体政协代表在广场执锹奠基，亲手培下第一锹土。今天你看到的\"三年以来……三十年以来……由此上溯到一千八百四十年\"三段碑文，就刻在这块巨石正面。(来源：新华网、人民网纪念碑史料)"},{"spot":"太庙","title":"故事·太庙：整根金丝楠木立起来的皇家祖庙【史实】","text":"太庙前殿的大柱是整根的金丝楠木，不加拼接——这种生长千年的名贵木料，纹理在灯下泛着金丝，明清时专供皇家，民间\"僭越\"使用是重罪。太庙是皇帝祭祖之地，\"左祖右社\"里的\"左祖\"就是它。【民间传说】太庙里还有相传明成祖朱棣亲手栽下的\"神柏\"，说移栽时以此树能否成活占卜国运——树活了，所以有了两百多年的明朝江山。传说不必当真，但太庙古柏森森、树龄数百年是实景，如今在劳动人民文化宫的树荫下散步，就是在当年皇帝祭祖的甬道上。(来源：北京市劳动人民文化宫（太庙）官方介绍；传说为民俗口传)"},{"spot":"社稷坛","title":"故事·社稷坛：五色土，一坛子\"江山\"【史实】","text":"社稷坛上铺着五种颜色的土：东青、南红、西白、北黑、中黄，对应五方五色。这些土不是随便挖的——明清时由全国各地纳贡而来，象征着\"普天之下莫非王土\"：五方之土汇于一坛，皇帝在坛前祭祀土神与谷神，祈的是江山永固、风调雨顺。\"社稷\"二字从此成为\"国家\"的代名词——所谓\"江山社稷\"，源头就在这座不到一亩的小坛。今天中山公园内的社稷坛五色土保存完好，是明朝永乐年间延续至今的原坛原制，站在坛边看五色土，看的其实是一整套古代政治哲学。(来源：北京市文物局、中山公园)"},{"spot":"南段御道","title":"故事·南段御道：挖开三层马路，底下是七百年前的皇帝走的路【史实】","text":"2022年，考古工作者在正阳门至永定门之间的地下开始发掘：先揭开现代沥青马路，再往下是晚清民国铺电车道时垫的土层，一层层\"剥洋葱\"之后，明代居中御道的石板出现了——它不偏不倚正压在中轴线的位置上。连同2004年的发掘，三处遗址实证了这条线从明代起就没有挪过窝，为\"7.8公里全线历史真实性\"补上了关键拼图。一条埋在地下几百年的路，靠着考古工作者的小铲子重见天日——这是中轴线上最新鲜的\"考古现场\"故事。(来源：北京市文物局、新华网)"},{"spot":"天坛","title":"故事·天坛：祈年殿烧毁过一次，回音壁会\"传话\"【史实】","text":"今天看到的祈年殿其实不是明代原件：清光绪十五年（1889年），一道雷火把这座大殿烧成了灰烬，光绪帝下令依原样重建——不设大梁长檩、全靠28根柱子撑起三重檐的力学奇迹，得以原汁原味重现，所以它既是\"复刻版\"，也是建筑史上的孤例。另一边，回音壁的神奇人人可体验：两人隔着墙站立，贴着墙轻声说话，声音像沿着墙\"爬\"过来一样清晰——圆形磨砖对缝的墙体让声波沿壁连续反射，是古人无意间造出的声学装置。逛天坛，一个看\"重建的奇迹\"，一个玩\"会传话的墙\"。(来源：天坛公园管理处、北京市文物局)"},{"spot":"先农坛","title":"故事·先农坛：皇帝也得下地干活，一年一天【史实】","text":"明清两代，每年开春，皇帝要亲自到先农坛的\"一亩三分地\"里扶犁耕地，行\"三推三返\"之礼——皇帝在前执犁，顺天府官员随后播种，礼毕登观耕台看大臣们继续耕完。这就是\"一亩三分地\"俗语的出处：天下都是皇帝的，但这一亩三分地必须他本人种。仪式的意义不在收成，而在向天下宣示\"重农\"——皇帝再尊贵，饭也得从土里来。如今在北京古代建筑博物馆（先农坛）里，还能看到当年的耤田与观耕台；每年这里还会举办复原的亲耕活动，孩子可以去体验\"皇帝的活儿\"有多累。(来源：北京市文物局、北京古代建筑博物馆)"},{"spot":"正阳门","title":"故事·正阳门：北京城唯一存世的完整城门组群【史实】","text":"老北京有句民谚：\"前门楼子九丈九\"——用夸张的数字形容正阳门的高大。它确实是内城九门里规格最高的城门，城楼、箭楼、瓮城曾构成完整的防御组群。1900年庚子之变中，城楼与箭楼毁于战火，清政府此后依原制重建，是今天中轴线上唯一城楼与箭楼俱存的城门——站在前门大街北望，城楼箭楼一前一后，就是老北京城防的\"最后一道门面\"。民谚的九丈九是虚数，但当年进出京城的旅人，望见前门楼子就知道：北京到了。(来源：北京市文物局、正阳门管理处；民谚为民间口传)"},{"spot":"永定门","title":"故事·永定门：消失五十年后，它又\"长\"回来了【史实】","text":"永定门的命运堪称传奇：1553年建成，是外城正门、中轴线南端起点；1957年因交通改造被拆除——中轴线的最南端从此\"断了头\"。转折在2004年：依据史料记载与考古信息，永定门在原址按原有位置与形制复建，中轴线南端的完整景观得以重新\"闭合\"，为两年后启动的申遗之路补回了关键一环。一座城门见证了两件事：拆掉它只用了几个月，重建它等了半个世纪。今天傍晚到永定门公园，看夕阳从复建城楼后落下，\"南望永定门、北看钟鼓楼\"的7.8公里壮美秩序再次完整。(来源：北京市文物局)"}],"images":{"钟鼓楼":{"src":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwg function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s){ // 迷你 markdown：表格/加粗/来源行
  const lines=s.split("\n");let out="",i=0;
  while(i<lines.length){const L=lines[i];
    if(/^\s*\|/.test(L)){let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i].trim());i++}
      let h="<div class='tblwrap'><table class='tbl'>";rows.forEach((r,j)=>{if(/^[\s|:\-]+$/.test(r))return;
        const cells=r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        h+="<tr>"+cells.map(c=>(j===0?"<th>":"<td>")+fmt2(c)+("</th>".replace("th",j===0?"th":"td"))).join("")+"</tr>"});
      out+=h+"</table></div>";continue;}
    out+=fmt2(L)+"<br>";i++;}
  return out.replace(/(<br>)+$/,"");
}
function fmt2(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}

const DISC="<div class='disc'>⏰ 开放/票务/预约等时效信息，以官方最新公告为准</div>";

// —— 检索 ——
function cjk(s){return (s.match(/[\u4e00-\u9fff]/g)||[]).join("")}
function bigrams(s){const t=cjk(s),o=new Set();for(let i=0;i<t.length-1;i++)o.add(t[i]+t[i+1]);return o}
function cover(q,ref){const bq=bigrams(q),br=bigrams(ref);let n=0;bq.forEach(x=>{if(br.has(x))n++});return {r:bq.size?n/bq.size:0,n:n}}
function faqByPrefix(p){const i=DATA.faq_titles.findIndex(t=>t.startsWith(p));return i<0?null:i}
function aliasHit(q){for(const r of DATA.aliases){if((r.terms||[]).length&&r.terms.every(t=>q.includes(t))){const i=faqByPrefix(r.q);if(i!=null)return i}}return -1}

  }
  // 2.5) 故事意图：查询含故事/传说词 → 按景点名定位对应故事；定位不到讲随机一个
  // 库外地名刹车（v2.3.9）：问到知识库外的易混地名（地坛/长城/颐和园……）不得退随机故事充数，直接拒答
  if(/故事|传说|轶事|轶闻|典故/.test(q)){
    if(NOT_SITES.some(w=>q.includes(w))){
      let spotted=false;
      for(const s of DATA.stories){if(s.spot&&q.includes(s.spot)){spotted=true;break}}
      if(!spotted)return {html:"您问的这个地方不在北京中轴线知识库里，我没有它的可靠故事资料，不能拿别的景点的故事来充数。建议查询北京市文物局官网或\"北京中轴线\"官方渠道。"};
    }
    let hit=null;
    for(const s of DATA.stories){if(s.spot&&q.includes(s.spot)){hit=s;break}}
    if(!hit){let bs=0;for(const s of DATA.stories){const sc=cover(q,s.title).r;if(sc>bs){bs=sc;hit=s}}
      if(bs<0.12)hit=DATA.stories[Math.floor(Math.random()*DATA.stories.length)];}
    return {html:"📖 <b>"+esc(hit.title)+"</b><br><br>"+fmt(hit.text),src:"21_景点故事分册.md · "+hit.title};
  }
  // 3) FAQ 别名对齐（与正式版同源规则）→ 标准口径
  let ai=aliasHit(q);
  if(ai<0){ // 4) FAQ 相似度对齐
    let best=-1,bs=0;
    DATA.faq_titles.forEach((t,i)=>{const s=cover(q,t).r;if(s>bs){bs=s;best=i}});
    if(bs>=0.42)ai=best;
  }
  if(ai>=0){const f=DATA.faqs[ai].split("\n");const title=f[0];const body=f.slice(1).join("\n");
    let h="<b>"+esc(title.replace(/^Q\d+\s*/,""))+"</b><br>"+fmt(body);
    if(TIME_KW.test(q)&&!/以官方最新公告为准/.test(body))h+=DISC;

    return {html:h,src:"19_高频问答对FAQ.md · "+title};}
  // 5) 知识库分块检索(FAQ 文件只走精确对齐,防"是怎么回事"这类通用问法虚命中)
  let best=null,bs=0;

    return {html:h,src:best.file+" · "+best.title};}

  return {html:"这个问题超出了我的离线知识库范围。本演示页不联网、不调用大模型，所以只能如实告知：离线版答不了它。<br><br>完整版会把它转交云端大模型作<b>通用知识回答</b>（并明确标注来源）；中轴线的文化历史、建筑形制、游览路线、沿线美食，我这里都可以继续聊～"};

  // v2.7.11 与引擎 intent.SITES 同源全别名+长键优先：

  const alias={"钟楼":"钟鼓楼","鼓楼":"钟鼓楼","钟鼓楼":"钟鼓楼","万宁桥":"万宁桥","后门桥":"万宁桥","景山":"景山","万春亭":"景山","故宫":"故宫","紫禁城":"故宫","太和殿":"故宫","午门":"故宫","神武门":"故宫","三大殿":"故宫","金銮殿":"故宫","端门":"端门","天安门":"天安门","金水桥":"外金水桥","外金水桥":"外金水桥","天安门广场":"天安门广场","广场":"天安门广场","人民英雄纪念碑":"天安门广场","纪念堂":"天安门广场","升旗":"天安门广场","太庙":"太庙","劳动人民文化宫":"太庙","社稷坛":"社稷坛","中山公园":"社稷坛","五色土":"社稷坛","道路遗存":"南段道路遗存","御道":"南段道路遗存","南段":"南段道路遗存","天坛":"天坛","祈年殿":"天坛","回音壁":"天坛","圜丘":"天坛","先农坛":"先农坛","耤田":"先农坛","一亩三分地":"先农坛","古代建筑博物馆":"先农坛","正阳门":"正阳门","前门大街":"正阳门","前门":"正阳门","永定门":"永定门"};
  const keys=Object.keys(alias).sort((a,b)=>b.length-a.length);
  for(const a of keys){if(text.includes(a)&&DATA.images[alias[a]])return alias[a];}
  const ks=Object.keys(DATA.images).sort((a,b)=>b.length-a.length);
  for(const k of ks){if(text.includes(k))return k;}
  return null;
}
// 库外易混地名（v2.3.9，与引擎 intent.NOT_SITES 同源）：问到这些词一律不贴图
const NOT_SITES=["地坛","月坛","日坛","雍和宫","孔庙","国子监","长城","颐和园","香山","北海","白塔寺","法源寺","潭柘寺","十三陵","卢沟桥","圆明园"];
function hasForeign(q){return NOT_SITES.some(w=>q.includes(w))}
// 教材课堂衔接一句话（v2.4.0，与引擎 textbook_hint 同源纪律）：
// 仅 qa 类通用回答挂载——Q28 本身已含全表不重复；故事/路线分支不挂；精确技术问不挂
const TB_HINTS={
  "故宫":"📖 课堂衔接：人教版美术九年级上册第2课《故宫六百年》、历史七年级下册第15课《明朝的统治》、美术五年级上册第7课《古朴精美的华表》都与紫禁城相关，游览时可对照课上所学看看实物（课文原文以纸质教材为准）。",
  "天安门":"📖 课堂衔接：人教版音乐一年级上册欣赏《我爱北京天安门》、语文一年级下册第3课《我多想去看看》、历史八年级上册第11课《五四运动》都写到天安门，课文原文以纸质教材为准。",
  "天安门广场":"📖 课堂衔接：人教版语文六年级上册第6课《开国大典》、八年级上册第21课《人民英雄永垂不朽》写到天安门广场，站在现场重读课文感受最深（课文原文以纸质教材为准）。"};
const TB_PRECISE=/为什么|几只|几座|多少|怎么|区别|故事|多长|多宽|多老|哪个|是否|对吧|对吗|是不是/;
function tbHint(qq,htmlTxt,src){
  if(src&&src.startsWith("21_"))return "";
  if(/Q28/.test(src||""))return "";
  let site=null;
  if(/天安门广场/.test(qq)||/人民英雄纪念碑/.test(htmlTxt))site="天安门广场";
  else if(/天安门/.test(qq))site="天安门";
  else if(/故宫|紫禁城/.test(qq))site="故宫";
  if(!site)return "";
  const cues=/课文|教材|课本|课堂|年级|学过|音乐课|历史课|美术课/;
  const isIntro=qq.length<=20&&!TB_PRECISE.test(qq);
  if(!(cues.test(qq)||isIntro))return "";
  return TB_HINTS[site];
}
function fillInput(text){const i=$("inp");i.value=text;i.focus();
  try{i.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
  try{i.setSelectionRange(i.value.indexOf("【")>=0?i.value.indexOf("【"):0,i.value.indexOf("】")>=0?i.value.indexOf("】")+1:i.value.length)}catch(e){}}
function send(q,lensOverride){
  const lens=lensOverride||curLens;
  add(esc(q),"me");
  const t=document.createElement("div");t.className="row bot";t.innerHTML='<div class="av">🏯</div><div class="bub">轴轴正在翻书找答案…</div>';chat.appendChild(t);scrollDown(t);
  setTimeout(()=>{t.remove();const a=answer(q);
    let head="";
    if(LENS_LABEL[lens])head="<span class='lensline'>"+LENS_LABEL[lens]+"作答</span><br>"+esc(LENS_OPEN[lens]||"")+"<br>";
    add(head+a.html,"bot");
    if(!(a.src&&a.src.startsWith("21_"))&&!hasForeign(q)){
      const sp=spotIn(a.html.replace(/<[^>]+>/g,""));
      if(sp&&DATA.images[sp]){const im=DATA.images[sp];
        const r3=document.createElement("div");r3.className="row";
        r3.innerHTML='<div class="av">🏯</div>';
        const b3=document.createElement("div");b3.className="bub";
        b3.innerHTML="<img src='"+im.src+"' alt='"+esc(sp)+"' style='max-width:100%;border-radius:10px;display:block'><div class='src'>"+esc(im.credit)+"</div>";
        r3.appendChild(b3);chat.appendChild(r3);scrollDown(r3);}
    }
    if(!(a.src&&a.src.startsWith("21_"))){
      const sts=storiesFor(a.html);
      if(sts.length){const r2=document.createElement("div");r2.className="row";
        r2.innerHTML='<div class="av">🏯</div>';
        const bx=document.createElement("div");bx.className="bub";
        bx.style.cssText="background:transparent;border:none;padding:2px 0;";
        sts.forEach(st=>{const btn=document.createElement("button");btn.className="chip";
          btn.textContent="📖 听《"+st.spot+"》的故事";btn.onclick=()=>sendStory(st);bx.appendChild(btn)});
        r2.appendChild(bx);chat.appendChild(r2);scrollDown(r2);}
    }
    let fups=LENS_FUPS[lens]||[];
    // 课本板块（v2.7.7/2.7.9）：追问按答案景点轮换——故宫重历史/美术问法，天安门重音乐/语文问法，其余给总表+写景迁移
    if(lens==="textbook"&&fups.length>3){
      const plain=a.html.replace(/<[^>]+>/g,"");
      const isGugong=/故宫|紫禁城/.test(q+plain)&&!/天安门/.test(q+plain);
      const isTianmen=/天安门|开国大典|五四|人民英雄/.test(q+plain);
      if(isGugong)fups=[fups[0],fups[1],fups[3]];
      else if(isTianmen)fups=[fups[0],fups[2],fups[4]];
      else fups=[fups[0],fups[5],fups[6]];
    }
    if(fups.length){const r4=document.createElement("div");r4.className="row";
      r4.innerHTML='<div class="av">🏯</div>';
      const bx4=document.createElement("div");bx4.className="bub";
      bx4.style.cssText="background:transparent;border:none;padding:2px 0;";
      const box=document.createElement("div");box.className="fups";
      fups.slice(0,3).forEach(f=>{const b=document.createElement("button");b.className="fup";b.textContent="💬 "+f[0];b.title=f[1];b.onclick=()=>send(f[1]);box.appendChild(b);});
      bx4.appendChild(box);r4.appendChild(bx4);chat.appendChild(r4);scrollDown(r4);}},260);
}

// 五分类导航（v2.5.0；v2.7.0 点模板透传板块 lens，手动输入沿用当前板块）
(function(){
  const bar=$("catbar"),panel=$("catpanel");
  if(!bar||!panel||!DATA.cats)return;
  DATA.cats.forEach((c,idx)=>{
    const b=document.createElement("button");b.className="catbtn"+(idx===0?" on":"");
    b.innerHTML=c.icon+"<b>"+esc(c.name)+"</b><span>"+esc(c.desc)+"</span>";
    b.onclick=()=>{
      curLens=c.id;
      bar.querySelectorAll(".catbtn").forEach(x=>x.className="catbtn");
      b.className="catbtn on";showCat(c);};
    bar.appendChild(b);});
  function showCat(c){
    panel.innerHTML="";
    const d=document.createElement("div");d.className="catdesc";
    d.textContent=c.icon+" "+c.name+" · "+c.desc+"：点模板把提问填进输入框，改好【】里的词再发送。";
    panel.appendChild(d);
    // —— 课本板块课堂地图（v2.7.8，与在线版同源）：35 篇目录级核验课文，点条目即问
    // —— v2.7.12 一屏一事：课堂地图默认收起（手机上不再全铺），想看点开 ——
    // —— v2.7.13 两级筛选：先选学段→再选学科，条目渐进呈现；高中诚实空位（暂无核验条目，不编造） ——
    if(c.id==="textbook"&&typeof KBMAP!=="undefined"){
      const km=document.createElement("details");km.className="kbmap";km.open=false;
      const sm=document.createElement("summary");sm.textContent="📖 课堂地图：先选学段，再选学科（35 篇核验课文 × 中轴线，点条目填入输入框）";
      km.appendChild(sm);
      const grps=(typeof KBGROUPS!=="undefined")?KBGROUPS:[["low","🌱 小学低段"],["high","🌳 小学高段"],["mid","🎓 初中"],["hig","📚 高中"]];
      const gradeShort={low:"🌱 小学低段",high:"🌳 小学高段",mid:"🎓 初中",hig:"📚 高中"};
      let kbG="low",kbS="全部";
      const gradeRow=document.createElement("div");gradeRow.className="kbfilt";
      const subjRow=document.createElement("div");subjRow.className="kbfilt";
      const kbList=document.createElement("div");
      const kbSubjects=g=>{const s=[];KBMAP.filter(k=>k.g===g).forEach(k=>{if(s.indexOf(k.d)<0)s.push(k.d)});return s;};
      function kbRender(){
        gradeRow.querySelectorAll("button").forEach(b=>{b.className="kbchip"+(b.dataset.g===kbG?" on":"");});
        subjRow.innerHTML="";kbList.innerHTML="";
        const subs=kbSubjects(kbG);
        if(!subs.length){
          const h=document.createElement("div");h.className="kbhint";
          h.textContent="📚 该学段暂无目录级核验条目：待后续核验后补充，这里不编条目。";
          kbList.appendChild(h);return;}
        if(subs.indexOf(kbS)<0)kbS="全部";
        const all=document.createElement("button");all.className="kbchip"+(kbS==="全部"?" on":"");all.textContent="全部";
        all.onclick=()=>{kbS="全部";kbRender();};subjRow.appendChild(all);
        subs.forEach(s=>{const b=document.createElement("button");b.className="kbchip"+(s===kbS?" on":"");b.textContent=s;
          b.onclick=()=>{kbS=s;kbRender();};subjRow.appendChild(b);});
        KBMAP.filter(k=>k.g===kbG&&(kbS==="全部"||k.d===kbS)).forEach(k=>{const b=document.createElement("button");b.className="kb";
          b.innerHTML="<b>"+esc(k.t)+"</b> → "+esc(k.s);b.title=k.q;
          b.onclick=()=>{curLens=c.id;fillInput(k.q);};kbList.appendChild(b);});
      }
      grps.forEach(gr=>{const b=document.createElement("button");b.className="kbchip";b.dataset.g=gr[0];
        b.textContent=gradeShort[gr[0]]||gr[1];
        b.onclick=()=>{kbG=gr[0];kbS="全部";kbRender();};gradeRow.appendChild(b);});
      km.appendChild(gradeRow);km.appendChild(subjRow);km.appendChild(kbList);
      kbRender();
      panel.appendChild(km);}
    // —— v2.7.12 一屏一事：模板区包进折叠块，默认收起（标题行显示条数），手机上不再全堆 ——
    const tw=document.createElement("details");tw.className="tmplwrap";tw.open=false;
    const ts=document.createElement("summary");ts.textContent="📝 提问模板（"+c.templates.length+" 个，点开展开，点条目填入输入框）";
    tw.appendChild(ts);
    const w=document.createElement("div");w.className="tmpls";
    c.templates.forEach(t=>{
      const m=document.createElement("button");m.className="tmpl";m.textContent="💬 "+t.label;
      m.title=t.q;m.textContent="📝 "+t.label;m.onclick=()=>{curLens=c.id;fillInput(t.fill||t.q);};w.appendChild(m);});
    tw.appendChild(w);panel.appendChild(tw);
  }
  curLens=DATA.cats[0].id;
  showCat(DATA.cats[0]);
})();
